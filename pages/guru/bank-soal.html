<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Soal Guru V2 | Teacher Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../../css/global.css">
    <style>@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap'); body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="flex h-screen bg-[#F8FAFC] overflow-hidden font-sans text-slate-800 w-full max-w-[100vw]">
    <div id="sidebar-container"></div>
    <main class="flex-1 flex flex-col h-screen overflow-hidden relative z-0 w-full">
        <header class="bg-white border-b border-slate-200 p-4 md:px-6 lg:px-8 flex justify-between items-center z-10 sticky top-0 shadow-sm w-full gap-4">
           <div class="flex items-center gap-3 flex-1 overflow-hidden pr-2">
             <button id="open-sidebar" class="md:hidden p-2 bg-slate-100 rounded-lg text-emerald-600 hover:bg-slate-200 transition-colors shrink-0"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
             <h2 class="text-[11px] md:text-xs lg:text-sm font-black text-slate-800 uppercase tracking-widest line-clamp-2 leading-snug break-words" id="topbar-school-name">Teacher Center V3</h2>
           </div>
           <div class="flex items-center gap-3 shrink-0">
               <div class="text-right hidden md:block ml-2"><p class="text-xs font-bold text-slate-800 truncate max-w-[120px]" id="user-name">Memuat...</p><p class="text-[9px] font-black text-emerald-600 uppercase tracking-widest">Guru Mapel</p></div>
               <div class="w-9 h-9 md:w-10 md:h-10 rounded-full bg-emerald-100 border border-emerald-200 flex items-center justify-center text-emerald-700 font-black shrink-0" id="user-initial">G</div>
           </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 custom-scrollbar w-full">
            <div class="max-w-6xl mx-auto space-y-6 pb-10 animate-in fade-in duration-500">
                <input type="file" id="excel-file-input" accept=".xlsx, .xls" class="hidden" />

                <div class="bg-white p-5 rounded-[24px] shadow-sm border border-slate-200 space-y-4">
                  <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-3 border-b border-slate-100 pb-3">
                    <h3 class="text-lg font-black text-slate-800 flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-emerald-500"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg> Bank Soal V2</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 w-full sm:w-auto">
                        <button id="btn-download-template" class="bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200 py-2.5 px-3 rounded-xl text-[10px] font-black flex items-center justify-center gap-1.5 transition-all"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> Excel</button>
                        <button id="btn-trigger-import" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 py-2.5 px-3 rounded-xl text-[10px] font-black flex items-center justify-center gap-1.5 transition-all"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg> Import</button>
                        <button id="btn-open-modal" class="bg-slate-800 hover:bg-slate-700 text-white py-2.5 px-3 rounded-xl text-[10px] font-black flex items-center justify-center gap-1.5 transition-all shadow-md active:scale-95"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg> Ketik</button>
                    </div>
                  </div>
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <select id="filter-mapel" class="w-full p-3 border border-slate-200 rounded-xl bg-slate-50 text-sm font-bold text-slate-700 outline-none focus:border-emerald-500 cursor-pointer"><option value="">-- Semua Mata Pelajaran --</option></select>
                    <select id="filter-kelas" class="w-full p-3 border border-slate-200 rounded-xl bg-slate-50 text-sm font-bold text-slate-700 outline-none focus:border-emerald-500 cursor-pointer"><option value="">-- Semua Tingkatan Kelas --</option></select>
                  </div>
                </div>

                <div id="soal-container" class="space-y-4">
                   <div class="text-center p-10 text-slate-400 bg-white rounded-2xl border border-dashed border-slate-300 text-sm font-bold">Memuat soal...</div>
                </div>
            </div>
        </div>
    </main>

    <div id="modal-soal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md flex items-center justify-center p-4 z-[110] hidden">
        <div class="bg-white p-5 md:p-6 rounded-[2rem] w-full max-w-4xl max-h-[90vh] overflow-y-auto shadow-2xl border border-white/20 custom-scrollbar">
            <h2 class="text-lg font-black text-slate-800 flex items-center gap-2 mb-5 border-b border-slate-100 pb-3" id="modal-title">Ketik Soal Baru</h2>
            
            <form id="form-soal" class="space-y-4">
                <input type="hidden" id="q_id">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-3 p-3 bg-slate-50 rounded-xl border border-slate-200">
                  <div class="md:col-span-2">
                     <label class="text-[9px] font-black text-slate-500 uppercase mb-1 block">Jenis Soal</label>
                     <select id="q_jenis" required class="w-full p-2.5 rounded-lg border border-slate-200 text-xs font-bold outline-none focus:border-emerald-500 cursor-pointer">
                        <option value="PG">Pilihan Ganda (PG) Biasa</option><option value="PGK">Pilihan Ganda Kompleks (PGK)</option><option value="ESAI">Soal Esai</option>
                     </select>
                  </div>
                  <div>
                      <label class="text-[9px] font-black text-slate-500 uppercase mb-1 block">Mata Pelajaran</label>
                      <select id="q_mapel" required class="w-full p-2.5 border border-slate-200 rounded-lg text-xs font-bold bg-white outline-none focus:border-emerald-500"><option value="">Pilih Mapel...</option></select>
                  </div>
                  <div>
                      <label class="text-[9px] font-black text-slate-500 uppercase mb-1 block">Kelas</label>
                      <select id="q_kelas" required class="w-full p-2.5 border border-slate-200 rounded-lg text-xs font-bold bg-white outline-none focus:border-emerald-500"><option value="">Pilih Kelas...</option></select>
                  </div>
                </div>

                <div class="p-3 bg-blue-50/50 border border-blue-100 rounded-xl space-y-2">
                    <label class="text-[10px] font-black text-blue-800 uppercase flex items-center gap-1.5"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg> Pengikat Wacana</label>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                        <div><input id="q_kws" placeholder="Kode Wacana" class="w-full p-2.5 border border-blue-200 rounded-lg text-xs font-bold bg-white uppercase outline-none focus:border-blue-500" /></div>
                        <div class="md:col-span-3"><textarea id="q_tws" placeholder="Teks wacana bacaan..." class="w-full p-2.5 border border-blue-200 rounded-lg text-xs font-medium bg-white min-h-[40px] outline-none focus:border-blue-500"></textarea></div>
                    </div>
                </div>

                <div>
                  <input id="q_gambar" placeholder="URL Gambar (Opsional)" class="w-full p-3 border border-slate-200 rounded-xl text-sm font-medium outline-none focus:border-emerald-500 mb-2" />
                  <label class="text-[10px] font-bold text-slate-500 uppercase mb-1 flex justify-between"><span>Teks Pertanyaan Utama</span><span class="text-[9px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded font-black">$...$ = Math</span></label>
                  <textarea id="q_tanya" required placeholder="Ketik soal di sini..." class="w-full p-4 border border-slate-200 rounded-xl min-h-[100px] text-sm outline-none focus:border-emerald-500"></textarea>
                </div>
                
                <div id="opsi-container">
                    <label class="text-[10px] font-bold text-slate-500 uppercase mb-1 block">Opsi Jawaban & Kunci</label>
                    <div id="pgk-alert" class="bg-orange-50 border border-orange-200 p-2.5 rounded-lg mb-2 text-[10px] font-bold text-orange-800 hidden">Mode PGK Aktif: Centang kotak opsi untuk menjadikannya Kunci Jawaban.</div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div class="flex gap-2 items-center">
                            <input type="checkbox" id="cb_A" value="A" class="cb-pgk w-5 h-5 rounded cursor-pointer accent-emerald-500 hidden" />
                            <div class="relative flex-1">
                                <span class="absolute left-3 top-3 font-black text-emerald-500 text-sm">A.</span>
                                <input id="q_oA" class="w-full pl-9 pr-3 py-3 border border-slate-200 rounded-xl text-sm outline-none focus:border-emerald-500" />
                            </div>
                        </div>
                        <div class="flex gap-2 items-center">
                            <input type="checkbox" id="cb_B" value="B" class="cb-pgk w-5 h-5 rounded cursor-pointer accent-emerald-500 hidden" />
                            <div class="relative flex-1">
                                <span class="absolute left-3 top-3 font-black text-emerald-500 text-sm">B.</span>
                                <input id="q_oB" class="w-full pl-9 pr-3 py-3 border border-slate-200 rounded-xl text-sm outline-none focus:border-emerald-500" />
                            </div>
                        </div>
                        <div class="flex gap-2 items-center">
                            <input type="checkbox" id="cb_C" value="C" class="cb-pgk w-5 h-5 rounded cursor-pointer accent-emerald-500 hidden" />
                            <div class="relative flex-1">
                                <span class="absolute left-3 top-3 font-black text-emerald-500 text-sm">C.</span>
                                <input id="q_oC" class="w-full pl-9 pr-3 py-3 border border-slate-200 rounded-xl text-sm outline-none focus:border-emerald-500" />
                            </div>
                        </div>
                        <div class="flex gap-2 items-center">
                            <input type="checkbox" id="cb_D" value="D" class="cb-pgk w-5 h-5 rounded cursor-pointer accent-emerald-500 hidden" />
                            <div class="relative flex-1">
                                <span class="absolute left-3 top-3 font-black text-emerald-500 text-sm">D.</span>
                                <input id="q_oD" class="w-full pl-9 pr-3 py-3 border border-slate-200 rounded-xl text-sm outline-none focus:border-emerald-500" />
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 items-center pt-3 border-t border-slate-100">
                  <div id="pg-kunci-container">
                      <label class="text-[10px] font-bold text-slate-500 uppercase mb-1 block">Kunci Jawaban</label>
                      <select id="q_kunci" class="w-full p-3 border border-emerald-300 bg-emerald-50 text-emerald-800 text-sm font-black rounded-xl outline-none focus:border-emerald-500">
                          <option value="A">Opsi A</option><option value="B">Opsi B</option><option value="C">Opsi C</option><option value="D">Opsi D</option>
                      </select>
                  </div>
                  <div class="flex gap-2 pt-4 sm:col-start-2">
                    <button type="button" id="btn-close-modal" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 rounded-xl text-sm font-bold text-slate-600 transition-colors">Batal</button>
                    <button type="submit" class="flex-1 py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-sm font-black shadow-sm transition-colors">Simpan</button>
                  </div>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { supabase } from '../../js/config/supabase.js';
        import { renderGuruSidebar } from '../../js/components/sidebar-guru.js';
        renderGuruSidebar();

        // LOGIKA JS GURU... (Saya pertahankan utuh sesuai versi sebelumnya yang berfungsi baik)
        // (Sama persis seperti versi sebelumnya, fitur KaTeX & Import Excel aman!)
        let schoolId = null;
        let teacherEmail = null;
        let bankData = [];

        async function initPage() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) return window.location.href = '../auth/login.html';
            const { data: profile } = await supabase.from('users').select('*').eq('id', session.user.id).single();
            schoolId = profile.school_id;
            teacherEmail = profile.email;
            
            document.getElementById('user-name').innerText = profile.name;
            document.getElementById('user-initial').innerText = profile.name.charAt(0).toUpperCase();

            const [{data: mapels}, {data: kelas}] = await Promise.all([
                supabase.from('master_subjects').select('name').eq('school_id', schoolId),
                supabase.from('master_classes').select('name').eq('school_id', schoolId)
            ]);

            if(mapels) document.getElementById('q_mapel').innerHTML += mapels.map(m => `<option value="${m.name}">${m.name}</option>`).join('');
            if(kelas) document.getElementById('q_kelas').innerHTML += kelas.map(k => `<option value="${k.name}">${k.name}</option>`).join('');
            
            loadSoal();
        }

        async function loadSoal() {
            const { data } = await supabase.from('bank_soal').select('*').eq('teacher_email', teacherEmail).order('created_at', { ascending: false });
            bankData = data || [];
            renderSoal(bankData);
        }

        function renderSoal(dataToRender) {
            const container = document.getElementById('soal-container');
            if (dataToRender.length === 0) {
                container.innerHTML = '<div class="text-center p-10 text-slate-400 bg-white rounded-2xl border border-dashed border-slate-300 text-sm font-bold">Belum ada soal untuk filter ini.</div>';
                return;
            }

            container.innerHTML = dataToRender.map((q, i) => `
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row gap-5 justify-between break-inside-avoid">
                  <div class="flex-1 min-w-0">
                    <div class="flex flex-wrap gap-2 mb-3 border-b border-slate-100 pb-3">
                      <span class="text-[10px] font-black bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-md border border-emerald-200">${q.mapel} - Tk. ${q.kelas}</span>
                      <span class="text-[10px] font-black px-2.5 py-1 rounded-md border ${(!q.jenis_soal || q.jenis_soal === 'PG') ? 'bg-blue-50 text-blue-700 border-blue-200' : q.jenis_soal === 'PGK' ? 'bg-orange-50 text-orange-700 border-orange-200' : 'bg-purple-50 text-purple-700 border-purple-200'}">
                         Tipe: ${q.jenis_soal || 'PG'}
                      </span>
                    </div>
                    <div class="font-bold text-base mb-4 text-slate-800 flex whitespace-pre-wrap"><span class="text-emerald-600 mr-2">${i+1}.</span><div class="flex-1 katex-render">${q.pertanyaan || ' '}</div></div>
                  </div>
                  <div class="flex gap-2 self-end md:self-start mt-3 md:mt-0 border-t md:border-t-0 md:border-l border-slate-100 pt-3 md:pt-0 md:pl-5 w-full md:w-auto">
                    <button onclick="editSoal('${q.id}')" class="flex-1 md:flex-none flex justify-center items-center bg-blue-50 hover:bg-blue-100 text-blue-600 p-3 rounded-xl transition-colors"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg></button>
                    <button onclick="delSoal('${q.id}')" class="flex-1 md:flex-none flex justify-center items-center bg-red-50 hover:bg-red-100 text-red-600 p-3 rounded-xl transition-colors"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
                  </div>
                </div>
            `).join('');

            if (window.renderMathInElement) {
                const els = document.querySelectorAll('.katex-render');
                els.forEach(el => renderMathInElement(el, { delimiters: [{left: "$", right: "$", display: false}, {left: "$$", right: "$$", display: true}] }));
            }
        }

        const modal = document.getElementById('modal-soal');
        const jenisSelect = document.getElementById('q_jenis');
        const opsiContainer = document.getElementById('opsi-container');
        const pgKunciContainer = document.getElementById('pg-kunci-container');
        const pgkAlert = document.getElementById('pgk-alert');
        const cbs = document.querySelectorAll('.cb-pgk');

        jenisSelect.addEventListener('change', (e) => {
            const v = e.target.value;
            if(v === 'ESAI') { opsiContainer.classList.add('hidden'); pgKunciContainer.classList.add('hidden'); }
            else if(v === 'PGK') { opsiContainer.classList.remove('hidden'); pgKunciContainer.classList.add('hidden'); pgkAlert.classList.remove('hidden'); cbs.forEach(cb => cb.classList.remove('hidden')); }
            else { opsiContainer.classList.remove('hidden'); pgKunciContainer.classList.remove('hidden'); pgkAlert.classList.add('hidden'); cbs.forEach(cb => cb.classList.add('hidden')); }
        });

        document.getElementById('btn-open-modal').onclick = () => { document.getElementById('form-soal').reset(); document.getElementById('q_id').value = ''; jenisSelect.dispatchEvent(new Event('change')); document.getElementById('modal-title').innerText = "Ketik Soal Baru"; modal.classList.remove('hidden'); modal.classList.add('flex'); };
        document.getElementById('btn-close-modal').onclick = () => { modal.classList.remove('flex'); modal.classList.add('hidden'); };

        window.editSoal = (id) => {
            const q = bankData.find(x => x.id == id);
            if(!q) return;
            document.getElementById('modal-title').innerText = "Revisi Soal";
            document.getElementById('q_id').value = q.id;
            document.getElementById('q_jenis').value = q.jenis_soal || 'PG';
            document.getElementById('q_mapel').value = q.mapel;
            document.getElementById('q_kelas').value = q.kelas;
            document.getElementById('q_kws').value = q.kode_wacana || '';
            document.getElementById('q_tws').value = q.teks_wacana || '';
            document.getElementById('q_gambar').value = q.gambar || '';
            document.getElementById('q_tanya').value = q.pertanyaan || '';
            
            ['A','B','C','D'].forEach(opt => { document.getElementById(`q_o${opt}`).value = q[`opsi_${opt.toLowerCase()}`] || ''; });
            
            jenisSelect.dispatchEvent(new Event('change'));
            if(q.jenis_soal === 'PGK') {
                const keys = q.kunci ? q.kunci.split(',') : [];
                cbs.forEach(cb => { cb.checked = keys.includes(cb.value); });
            } else { document.getElementById('q_kunci').value = q.kunci || 'A'; }
            
            modal.classList.remove('hidden'); modal.classList.add('flex');
        };

        window.delSoal = async (id) => { if(confirm("Hapus permanen soal ini?")) { await supabase.from('bank_soal').delete().eq('id', id); loadSoal(); } };

        document.getElementById('form-soal').onsubmit = async (e) => {
            e.preventDefault();
            const jenis = document.getElementById('q_jenis').value;
            let kunciAkhir = '';
            
            if(jenis === 'PG') kunciAkhir = document.getElementById('q_kunci').value;
            if(jenis === 'PGK') {
                const checked = Array.from(cbs).filter(cb => cb.checked).map(cb => cb.value);
                kunciAkhir = checked.sort().join(',');
                if(!kunciAkhir) return alert("Pilih minimal 1 kunci jawaban untuk PGK!");
            }

            const payload = {
                school_id: schoolId, teacher_email: teacherEmail,
                jenis_soal: jenis, mapel: document.getElementById('q_mapel').value, kelas: document.getElementById('q_kelas').value,
                kode_wacana: document.getElementById('q_kws').value, teks_wacana: document.getElementById('q_tws').value,
                gambar: document.getElementById('q_gambar').value, pertanyaan: document.getElementById('q_tanya').value,
                opsi_a: jenis === 'ESAI' ? '' : document.getElementById('q_oA').value,
                opsi_b: jenis === 'ESAI' ? '' : document.getElementById('q_oB').value,
                opsi_c: jenis === 'ESAI' ? '' : document.getElementById('q_oC').value,
                opsi_d: jenis === 'ESAI' ? '' : document.getElementById('q_oD').value,
                kunci: kunciAkhir
            };

            const id = document.getElementById('q_id').value;
            if(id) await supabase.from('bank_soal').update(payload).eq('id', id); else await supabase.from('bank_soal').insert([payload]);
            modal.classList.remove('flex'); modal.classList.add('hidden'); loadSoal();
        };

        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
