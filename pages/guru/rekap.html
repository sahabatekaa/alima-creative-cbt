<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rekap Nilai | Teacher Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="../../css/global.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap'); 
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        @media print { 
          @page { margin: 1.5cm; size: portrait; } 
          html, body { background: white !important; color: black !important; }
          body > *:not(#print-frame) { display: none !important; }
          #print-frame { display: block !important; position: absolute !important; top: 0; left: 0; width: 100%; background: white; }
        }
    </style>
</head>
<body class="flex h-[100dvh] bg-[#F8FAFC] overflow-hidden font-sans text-slate-800 w-full max-w-[100vw]">
    
    <div id="sidebar-container"></div>
    <main class="flex-1 flex flex-col h-full overflow-hidden relative z-0 w-full">
        
        <header class="bg-white border-b border-slate-200 p-4 md:px-6 flex justify-between items-center z-10 sticky top-0 shadow-sm shrink-0">
           <div class="flex items-center gap-3 flex-1 overflow-hidden pr-2">
             <button id="open-sidebar" class="md:hidden p-2 bg-slate-100 rounded-lg text-emerald-600 hover:bg-slate-200 transition-colors shrink-0">
                 <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
             </button>
             <h2 class="text-xs md:text-sm font-black text-slate-800 uppercase tracking-widest line-clamp-2 leading-snug break-words" id="topbar-school-name">Teacher Center V3</h2>
           </div>
           <div class="flex items-center gap-3 shrink-0">
               <div class="text-right hidden md:block ml-2">
                   <p class="text-xs font-bold text-slate-800 truncate max-w-[120px]" id="user-name">Memuat...</p>
                   <p class="text-[9px] font-black text-emerald-600 uppercase tracking-widest">Guru Mapel</p>
               </div>
               <div class="w-9 h-9 md:w-10 md:h-10 rounded-full bg-emerald-100 border border-emerald-200 flex items-center justify-center text-emerald-700 font-black shrink-0" id="user-initial">G</div>
           </div>
        </header>

        <div class="flex-1 overflow-y-auto p-3 sm:p-4 md:p-6 lg:p-8 custom-scrollbar w-full relative">
            <div class="max-w-6xl mx-auto space-y-4 md:space-y-5 animate-in fade-in duration-300 pb-10">
                
                <div class="bg-white p-4 md:p-6 rounded-[20px] shadow-sm border border-slate-200 space-y-4">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 border-b border-slate-100 pb-4">
                        <div class="w-full md:w-auto">
                            <h3 class="text-sm md:text-lg font-black text-slate-800 flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-emerald-500"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg> Rekapitulasi & Cetak</h3>
                            <p class="text-[10px] md:text-xs font-bold text-slate-400 mt-1">Saring berdasarkan sesi untuk melihat analisis dan mengkoreksi.</p>
                        </div>
                        <div class="flex gap-2 w-full md:w-auto">
                            <button id="btn-export-excel" class="flex-1 md:flex-none bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 px-3 py-2 md:py-2.5 rounded-xl text-[10px] md:text-xs font-black flex items-center justify-center gap-1.5 transition-all"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> Excel</button>
                            <button id="btn-bersihkan" class="flex-1 md:flex-none bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-3 py-2 md:py-2.5 rounded-xl text-[10px] md:text-xs font-black flex items-center justify-center gap-1.5 transition-all"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg> Reset</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 md:gap-3 bg-slate-50 p-2 md:p-3 rounded-xl md:rounded-2xl border border-slate-100">
                        <select id="f-mapel" class="w-full p-2.5 md:p-3 border border-slate-200 rounded-lg md:rounded-xl bg-white outline-none text-[11px] md:text-xs font-bold text-slate-700 focus:border-emerald-500"><option value="">-- Semua Mapel --</option></select>
                        <select id="f-kelas" class="w-full p-2.5 md:p-3 border border-slate-200 rounded-lg md:rounded-xl bg-white outline-none text-[11px] md:text-xs font-bold text-slate-700 focus:border-emerald-500"><option value="">-- Semua Kelas --</option></select>
                        <select id="f-subkelas" class="w-full p-2.5 md:p-3 border border-emerald-300 rounded-lg md:rounded-xl bg-emerald-50 outline-none text-[11px] md:text-xs font-black text-emerald-800 focus:border-emerald-500"><option value="">-- Semua Sub Kelas --</option></select>
                    </div>

                    <div class="flex flex-col sm:flex-row gap-2 md:gap-2.5 pt-1">
                        <button onclick="generatePDF('rekap')" class="flex-1 bg-slate-800 text-white py-2.5 md:py-3 rounded-lg md:rounded-xl text-[11px] md:text-xs font-black shadow-sm flex items-center justify-center gap-1.5 active:scale-95 transition-all"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path></svg> Cetak Nilai</button>
                        <button onclick="generatePDF('berita')" class="flex-1 bg-blue-600 text-white py-2.5 md:py-3 rounded-lg md:rounded-xl text-[11px] md:text-xs font-black shadow-sm active:scale-95 transition-all">Berita Acara</button>
                        <button onclick="generatePDF('hadir')" class="flex-1 bg-emerald-600 text-white py-2.5 md:py-3 rounded-lg md:rounded-xl text-[11px] md:text-xs font-black shadow-sm active:scale-95 transition-all">Daftar Hadir</button>
                    </div>
                </div>

                <div class="bg-white rounded-[20px] border border-slate-200 p-3 md:p-4 shadow-sm w-full relative">
                    <p class="md:hidden text-[9px] text-slate-400 font-bold mb-2 text-right animate-pulse">Geser tabel ke kiri/kanan ↔️</p>
                    <div class="overflow-x-auto w-full custom-scrollbar pb-2 rounded-xl border border-slate-100 md:border-none md:rounded-none">
                        <table class="w-full text-left text-sm whitespace-nowrap min-w-[550px]">
                            <thead class="bg-slate-50 text-slate-500 border-b border-slate-200">
                                <tr>
                                    <th class="py-2.5 px-2 md:px-3 text-center w-8 font-black uppercase text-[9px] md:text-[10px] tracking-wider">No</th>
                                    <th class="py-2.5 px-2 md:px-3 font-black uppercase text-[9px] md:text-[10px] tracking-wider">Siswa</th>
                                    <th class="py-2.5 px-2 md:px-3 text-center font-black uppercase text-[9px] md:text-[10px] tracking-wider">Kls/Ruang</th>
                                    <th class="py-2.5 px-2 md:px-3 text-center font-black uppercase text-[9px] md:text-[10px] tracking-wider">Skor (PG|E)</th>
                                    <th class="py-2.5 px-2 md:px-3 text-center font-black uppercase text-[9px] md:text-[10px] tracking-wider">Nilai Akhir</th>
                                    <th class="py-2.5 px-2 md:px-3 text-center font-black uppercase text-[9px] md:text-[10px] tracking-wider">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="rekap-table-body" class="divide-y divide-slate-100">
                                <tr><td colspan="6" class="p-6 md:p-8 text-center text-slate-400 font-bold text-xs">Memuat data...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div id="modal-analisis" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[200] hidden items-center justify-center p-3 sm:p-4 transition-all duration-300">
            <div class="bg-white rounded-2xl md:rounded-[2rem] w-full max-w-4xl shadow-2xl overflow-hidden flex flex-col max-h-[95dvh]">
                <div class="p-4 md:p-6 border-b border-slate-100 flex justify-between items-center bg-slate-900 text-white shrink-0">
                    <div class="min-w-0 pr-3">
                        <h2 class="text-sm md:text-xl font-black flex items-center gap-1.5 md:gap-2 truncate"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="w-4 h-4 md:w-5 md:h-5 text-blue-400"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg> Analisis Jawaban</h2>
                        <p id="analisis-name" class="text-[10px] md:text-xs font-bold text-slate-400 mt-0.5 uppercase tracking-widest truncate">NAMA SISWA</p>
                    </div>
                    <button onclick="document.getElementById('modal-analisis').classList.replace('flex','hidden')" class="p-1.5 md:p-2 bg-white/10 rounded-full hover:bg-rose-500 transition-colors shrink-0"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
                </div>
                <div id="analisis-content" class="p-4 md:p-8 overflow-y-auto flex-1 space-y-4 md:space-y-6 bg-slate-50 custom-scrollbar"></div>
            </div>
        </div>

        <div id="modal-koreksi" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[200] hidden items-center justify-center p-3 sm:p-4 transition-all duration-300">
            <div class="bg-white rounded-2xl md:rounded-[2rem] w-full max-w-3xl shadow-2xl overflow-hidden flex flex-col max-h-[95dvh]">
                <div class="p-4 md:p-6 border-b border-slate-100 flex justify-between items-center bg-slate-900 text-white shrink-0">
                    <div class="min-w-0 pr-3">
                        <h2 class="text-sm md:text-xl font-black flex items-center gap-1.5 md:gap-2 truncate"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="w-4 h-4 md:w-5 md:h-5 text-amber-400"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg> Koreksi Esai</h2>
                        <p id="koreksi-name" class="text-[9px] md:text-xs font-bold text-slate-400 mt-0.5 uppercase tracking-widest truncate">NAMA SISWA</p>
                    </div>
                    <button onclick="document.getElementById('modal-koreksi').classList.replace('flex','hidden')" class="p-1.5 md:p-2 bg-white/10 rounded-full hover:bg-rose-500 transition-colors shrink-0"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
                </div>
                <div id="koreksi-content" class="p-4 md:p-8 overflow-y-auto flex-1 space-y-4 md:space-y-6 bg-slate-50 custom-scrollbar"></div>
                <div class="p-3 md:p-5 border-t border-slate-200 bg-white shadow-[0_-10px_20px_rgba(0,0,0,0.05)] shrink-0">
                    <button id="btn-simpan-koreksi" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-3 md:py-4 rounded-xl font-black text-xs md:text-sm tracking-widest active:scale-95 transition-all shadow-lg flex items-center justify-center gap-2">SIMPAN NILAI AKHIR</button>
                </div>
            </div>
        </div>
    </main>

    <div id="print-frame" class="hidden text-black bg-white p-4"></div>

    <script type="module">
        import { supabase } from '../../js/config/supabase.js';
        import { renderGuruSidebar } from '../../js/components/sidebar-guru.js';
        setTimeout(() => renderGuruSidebar(), 100);

        let schoolId = null; let teacherEmail = null; let teacherName = '';
        let rawData = []; let filteredData = []; 
        let activeStudentId = null;
        let bobotPG_Aktif = 40; let bobotEsai_Aktif = 60; 
        
        let sNama = 'NAMA SEKOLAH'; let sAlamat = 'Alamat Instansi'; let sTelp = '-'; let sKota = 'Kota/Kabupaten';

        async function initPage() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) return window.location.href = '../auth/login.html';
            const { data: profile } = await supabase.from('users').select('*').eq('id', session.user.id).single();
            schoolId = profile.school_id; teacherEmail = profile.email; teacherName = profile.name;
            
            document.getElementById('user-name').innerText = teacherName;
            document.getElementById('user-initial').innerText = teacherName.charAt(0).toUpperCase();
            
            const { data: school } = await supabase.from('schools').select('*').eq('id', schoolId).single();
            if(school) {
                document.getElementById('topbar-school-name').innerText = school.name;
                sNama = school.name.toUpperCase();
                sAlamat = school.alamat || 'Alamat Belum Diatur';
                sTelp = school.telepon || '-';
                sKota = school.kota || 'Kota/Kabupaten'; 
            }
            loadLeaderboard();
        }

        async function loadLeaderboard() {
            const { data: lead, error } = await supabase.from('leaderboard').select('*').eq('teacher_email', teacherEmail).order('created_at', { ascending: false });
            if (error || !lead || lead.length === 0) {
                document.getElementById('rekap-table-body').innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-400 font-bold border-2 border-dashed border-slate-100 rounded-xl">Belum ada nilai ujian.</td></tr>`;
                return;
            }
            rawData = lead;
            
            const mSet = [...new Set(rawData.map(l => l.mapel).filter(Boolean))];
            const kSet = [...new Set(rawData.map(l => l.kelas).filter(Boolean))];
            const skSet = [...new Set(rawData.map(l => l.sub_kelas).filter(Boolean))];

            document.getElementById('f-mapel').innerHTML = '<option value="">-- Semua Mapel --</option>' + mSet.map(m => `<option value="${m}">${m}</option>`).join('');
            document.getElementById('f-kelas').innerHTML = '<option value="">-- Semua Kelas --</option>' + kSet.map(k => `<option value="${k}">${k}</option>`).join('');
            document.getElementById('f-subkelas').innerHTML = '<option value="">-- Semua Sub Kelas --</option>' + skSet.map(sk => `<option value="${sk}">${sk}</option>`).join('');

            document.getElementById('f-mapel').onchange = filterData;
            document.getElementById('f-kelas').onchange = filterData;
            document.getElementById('f-subkelas').onchange = filterData;
            filterData();
        }

        function filterData() {
            const m = document.getElementById('f-mapel').value;
            const k = document.getElementById('f-kelas').value;
            const sk = document.getElementById('f-subkelas').value;
            filteredData = rawData.filter(l => (m === '' || l.mapel === m) && (k === '' || l.kelas === k) && (sk === '' || l.sub_kelas === sk));
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('rekap-table-body');
            if(filteredData.length === 0) return tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-400 font-bold text-xs">Data kosong.</td></tr>`;

            tbody.innerHTML = filteredData.map((l, i) => `
                <tr class="hover:bg-slate-50 transition-colors border-b border-slate-100">
                    <td class="py-2.5 px-2 md:px-3 text-center font-bold text-slate-400 text-[10px] md:text-xs">${i + 1}</td>
                    <td class="py-2.5 px-2 md:px-3">
                        <p class="font-black text-slate-800 text-[11px] md:text-sm uppercase">${l.student_name || 'Anonim'}</p>
                        ${l.is_essay_graded ? '<span class="text-[7px] md:text-[8px] font-black bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded border mt-0.5 inline-block">ESAI SELESAI</span>' : '<span class="text-[7px] md:text-[8px] font-black bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded border mt-0.5 inline-block">PERLU KOREKSI</span>'}
                    </td>
                    <td class="py-2.5 px-2 md:px-3 text-center font-bold text-slate-600 text-[10px] md:text-xs">${l.kelas}-${l.sub_kelas || ''}</td>
                    <td class="py-2.5 px-2 md:px-3 text-center font-bold uppercase">
                        <div class="inline-flex flex-col sm:flex-row items-center bg-slate-50 border border-slate-200 rounded-md overflow-hidden text-[9px] md:text-[10px]"><span class="px-1.5 py-0.5 md:py-1 bg-white text-slate-500 w-full sm:w-auto border-b sm:border-b-0 sm:border-r border-slate-200">PG:<b class="text-slate-800 ml-1">${l.objective_score||0}</b></span><span class="px-1.5 py-0.5 md:py-1 text-slate-500 w-full sm:w-auto">E:<b class="${l.essay_score > 0 ? 'text-amber-600' : 'text-slate-800'} ml-1">${l.essay_score||0}</b></span></div>
                    </td>
                    <td class="py-2.5 px-2 md:px-3 text-center">
                        <span class="text-base md:text-xl font-black ${l.score < 70 ? 'text-rose-600' : 'text-emerald-600'}">${Math.round(l.score) || 0}</span>
                    </td>
                    <td class="py-2.5 px-2 md:px-3 text-center">
                        <div class="flex justify-center items-center gap-1 md:gap-1.5 flex-nowrap">
                            <button onclick="analisisSiswa('${l.id}')" class="text-blue-500 p-1.5 md:p-2 rounded-md md:rounded-lg bg-blue-50 border border-blue-200 shrink-0"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></button>
                            <button onclick="koreksiSiswa('${l.id}', '${l.token}')" class="text-amber-500 p-1.5 md:p-2 rounded-md md:rounded-lg bg-amber-50 border border-amber-200 shrink-0"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg></button>
                            <button onclick="delRekap('${l.id}')" class="text-rose-500 p-1.5 md:p-2 rounded-md md:rounded-lg bg-rose-50 border border-rose-200 shrink-0"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"></polyline></svg></button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        window.generatePDF = (mode) => {
            if(filteredData.length === 0) return alert("Saring data terlebih dahulu sebelum mencetak!");
            
            const frame = document.getElementById('print-frame');
            const dateStr = new Date().toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' });
            const mapelTxt = document.getElementById('f-mapel').value || 'Semua Mata Pelajaran';
            const kelasTxt = document.getElementById('f-kelas').value || 'Semua Kelas';
            const subKelasTxt = document.getElementById('f-subkelas').value || 'Semua Ruang';
            
            let htmlContent = `
                <div style="text-align: center; border-bottom: 4px double black; padding-bottom: 15px; margin-bottom: 20px;">
                    <h1 style="font-size: 24px; font-weight: 900; margin: 0; text-transform: uppercase;">${sNama}</h1>
                    <h2 style="font-size: 14px; margin: 5px 0;">${sAlamat}</h2>
                    <p style="font-size: 12px; margin: 0; color: #555;">Telepon: ${sTelp}</p>
                </div>
            `;

            if(mode === 'rekap') {
                htmlContent += `
                    <h3 style="text-align: center; font-size: 18px; font-weight: bold; text-decoration: underline; margin-bottom: 20px;">DAFTAR NILAI UJIAN</h3>
                    <p style="font-size: 12px; margin-bottom: 10px;">Mata Pelajaran: <b>${mapelTxt}</b> <br> Kelas: <b>${kelasTxt}</b> | Ruang: <b>${subKelasTxt}</b></p>
                    <table style="width: 100%; border-collapse: collapse; margin-bottom: 30px;">
                        <thead>
                            <tr style="background-color: #f1f5f9;">
                                <th style="border: 1px solid black; padding: 8px; text-align: center; font-size: 12px; width: 40px;">No</th>
                                <th style="border: 1px solid black; padding: 8px; text-align: left; font-size: 12px;">Identitas Siswa</th>
                                <th style="border: 1px solid black; padding: 8px; text-align: center; font-size: 12px;">Kelas</th>
                                <th style="border: 1px solid black; padding: 8px; text-align: center; font-size: 12px;">Skor (PG | Esai)</th>
                                <th style="border: 1px solid black; padding: 8px; text-align: center; font-size: 12px;">Nilai Akhir</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${filteredData.map((l, i) => `
                                <tr>
                                    <td style="border: 1px solid black; padding: 8px; text-align: center; font-size: 12px;">${i+1}</td>
                                    <td style="border: 1px solid black; padding: 8px; font-size: 12px; text-transform: uppercase;">${l.student_name}</td>
                                    <td style="border: 1px solid black; padding: 8px; text-align: center; font-size: 12px;">${l.kelas}-${l.sub_kelas||''}</td>
                                    <td style="border: 1px solid black; padding: 8px; text-align: center; font-size: 12px;">PG: ${l.objective_score||0} | E: ${l.essay_score||0}</td>
                                    <td style="border: 1px solid black; padding: 8px; text-align: center; font-size: 12px; font-weight: bold;">${Math.round(l.score)||0}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } 
            else if(mode === 'hadir') {
                htmlContent += `
                    <h3 style="text-align: center; font-size: 18px; font-weight: bold; text-decoration: underline; margin-bottom: 20px;">DAFTAR HADIR PESERTA UJIAN</h3>
                    <p style="font-size: 12px; margin-bottom: 10px;">Mata Pelajaran: <b>${mapelTxt}</b> <br> Kelas: <b>${kelasTxt}</b> | Ruang: <b>${subKelasTxt}</b></p>
                    <table style="width: 100%; border-collapse: collapse; margin-bottom: 30px;">
                        <thead>
                            <tr style="background-color: #f1f5f9;">
                                <th style="border: 1px solid black; padding: 8px; text-align: center; font-size: 12px; width: 40px;">No</th>
                                <th style="border: 1px solid black; padding: 8px; text-align: left; font-size: 12px;">Nama Siswa</th>
                                <th style="border: 1px solid black; padding: 8px; text-align: center; font-size: 12px;">Kelas</th>
                                <th style="border: 1px solid black; padding: 8px; text-align: left; font-size: 12px; width: 250px;">Tanda Tangan</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${filteredData.map((l, i) => `
                                <tr>
                                    <td style="border: 1px solid black; padding: 8px; text-align: center; font-size: 12px;">${i+1}</td>
                                    <td style="border: 1px solid black; padding: 8px; font-size: 12px; text-transform: uppercase;">${l.student_name}</td>
                                    <td style="border: 1px solid black; padding: 8px; text-align: center; font-size: 12px;">${l.kelas}-${l.sub_kelas||''}</td>
                                    <td style="border: 1px solid black; padding: 8px; font-size: 12px; height: 35px;">${i+1}.</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            }
            else if(mode === 'berita') {
                const arrBulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
                const arrHari = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
                const tgl = new Date();
                
                htmlContent += `
                    <h3 style="text-align: center; font-size: 18px; font-weight: bold; text-decoration: underline; margin-bottom: 30px;">BERITA ACARA PELAKSANAAN UJIAN CBT</h3>
                    <div style="font-size: 14px; line-height: 1.8; text-align: justify;">
                        <p>Pada hari ini <b>${arrHari[tgl.getDay()]}</b> tanggal <b>${tgl.getDate()}</b> bulan <b>${arrBulan[tgl.getMonth()]}</b> tahun <b>${tgl.getFullYear()}</b>, telah diselenggarakan Ujian Berbasis Komputer (CBT) dengan rincian sebagai berikut:</p>
                        <br>
                        <table style="width: 100%; border: none; margin-bottom: 20px;">
                            <tr><td style="width: 250px; padding: 5px 0;">Mata Pelajaran</td><td>: <b>${mapelTxt}</b></td></tr>
                            <tr><td style="padding: 5px 0;">Tingkat Kelas</td><td>: <b>${kelasTxt}</b></td></tr>
                            <tr><td style="padding: 5px 0;">Ruangan / Sub Kelas</td><td>: <b>${subKelasTxt}</b></td></tr>
                            <tr><td style="padding: 5px 0;">Jumlah Peserta Terdaftar</td><td>: <b>${filteredData.length} Peserta</b></td></tr>
                            <tr><td style="padding: 5px 0;">Jumlah Peserta Hadir</td><td>: <b>________ Peserta</b></td></tr>
                            <tr><td style="padding: 5px 0;">Jumlah Peserta Tidak Hadir</td><td>: <b>________ Peserta</b></td></tr>
                        </table>
                        <br>
                        <p>Catatan / Kejadian Penting selama pelaksanaan ujian:</p>
                        <div style="width: 100%; height: 150px; border: 1px solid black; margin-top: 10px;"></div>
                        <br>
                        <p>Demikian berita acara ini dibuat dengan sesungguhnya untuk dapat dipergunakan sebagaimana mestinya.</p>
                    </div>
                `;
            }

            if(mode === 'berita') {
                htmlContent += `
                    <div style="display: flex; justify-content: space-between; margin-top: 60px; text-align: center; font-size: 14px;">
                        <div style="width: 250px;">
                            <p>Mengetahui,</p>
                            <p style="margin-top: 5px;">Kepala Sekolah</p>
                            <br><br><br>
                            <p style="font-weight: bold; text-decoration: underline;">_________________________</p>
                        </div>
                        <div style="width: 250px;">
                            <p>${sKota}, ${dateStr}</p>
                            <p style="margin-top: 5px;">Pengawas Ujian</p>
                            <br><br><br>
                            <p style="font-weight: bold; text-decoration: underline;">${teacherName}</p>
                        </div>
                    </div>
                `;
            } else {
                htmlContent += `
                    <div style="display: flex; justify-content: flex-end; margin-top: 50px; text-align: center; font-size: 14px;">
                        <div style="width: 250px;">
                            <p>${sKota}, ${dateStr}</p>
                            <p style="margin-top: 5px;">${mode === 'hadir' ? 'Pengawas Ruangan,' : 'Guru Mata Pelajaran,'}</p>
                            <br><br><br>
                            <p style="font-weight: bold; text-decoration: underline; text-transform: uppercase;">${mode === 'hadir' ? '_________________________': teacherName}</p>
                        </div>
                    </div>
                `;
            }

            frame.innerHTML = htmlContent;
            setTimeout(() => { window.print(); }, 200);
        };

        document.getElementById('btn-export-excel').onclick = () => {
            if(filteredData.length===0) return alert("Data Kosong!");
            const rows = filteredData.map((l, i) => ({ "No": i+1, "Nama Siswa": l.student_name, "Kelas": l.kelas, "Ruang": l.sub_kelas, "Mapel": l.mapel, "Nilai PG": l.objective_score, "Nilai Esai": l.essay_score, "Skor Akhir": Math.round(l.score) }));
            const ws = XLSX.utils.json_to_sheet(rows); const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Rekap CBT"); XLSX.writeFile(wb, `Rekap_Nilai_${new Date().toISOString().slice(0,10)}.xlsx`);
        };
        
        document.getElementById('btn-bersihkan').onclick = async () => { const c = prompt("Ketik HAPUS untuk membersihkan semua nilai Anda:"); if(c === "HAPUS") { await supabase.from('leaderboard').delete().eq('teacher_email', teacherEmail); loadLeaderboard(); } };
        window.delRekap = async (id) => { if(confirm("Hapus permanen data nilai siswa ini?")) { await supabase.from('leaderboard').delete().eq('id', id); loadLeaderboard(); } };

        window.analisisSiswa = async (id) => {
            const student = rawData.find(r => r.id === id);
            if(!student) return;

            document.getElementById('analisis-name').innerText = student.student_name;
            document.getElementById('modal-analisis').classList.remove('hidden'); document.getElementById('modal-analisis').classList.add('flex');
            const content = document.getElementById('analisis-content');
            content.innerHTML = '<div class="text-center p-6 md:p-10 font-bold text-slate-400 animate-pulse text-xs md:text-sm">Memuat naskah soal...</div>';

            const { data: soalList } = await supabase.from('bank_soal')
                .select('*')
                .eq('mapel', student.mapel)
                .eq('kelas', student.kelas)
                .eq('teacher_email', teacherEmail); 
                
            if(!soalList || soalList.length === 0) {
                content.innerHTML = '<div class="text-center p-6 text-rose-500 font-bold border-2 border-dashed border-rose-200 rounded-xl text-xs md:text-sm">Soal tidak ditemukan di bank soal.</div>'; return;
            }

            const ans = student.answers || {};
            let htmlPG = `<div class="bg-white p-4 md:p-6 rounded-2xl md:rounded-3xl shadow-sm border border-slate-200 mb-4 md:mb-6"><h3 class="font-black text-slate-800 mb-4 border-b border-slate-100 pb-2.5 flex items-center justify-between text-[11px] md:text-base"><span>PILIHAN GANDA</span><span class="text-blue-500 bg-blue-50 px-2 py-1 rounded-md text-[9px] md:text-sm">Skor: ${student.objective_score||0}</span></h3><div class="grid grid-cols-1 sm:grid-cols-2 gap-3 md:gap-4">`;
            let htmlEsai = `<div class="bg-white p-4 md:p-6 rounded-2xl md:rounded-3xl shadow-sm border border-slate-200"><h3 class="font-black text-slate-800 mb-4 border-b border-slate-100 pb-2.5 flex items-center justify-between text-[11px] md:text-base"><span>JAWABAN ESAI</span><span class="text-amber-500 bg-amber-50 px-2 py-1 rounded-md text-[9px] md:text-sm">Skor: ${student.essay_score||0}</span></h3><div class="space-y-3 md:space-y-4">`;
            
            let countPG = 0; let countEsai = 0;

            soalList.forEach((soal, idx) => {
                const jwb = ans[soal.id] || '-';
                if(soal.jenis_soal !== 'ESAI') {
                    countPG++;
                    const isBenar = (jwb === soal.kunci);
                    htmlPG += `
                        <div class="flex items-center justify-between p-3 md:p-4 rounded-xl border-2 ${isBenar ? 'bg-emerald-50/50 border-emerald-400' : 'bg-rose-50/50 border-rose-400'} overflow-hidden">
                            <div class="min-w-0 pr-2">
                                <span class="font-black text-slate-400 text-[8px] md:text-[10px] uppercase tracking-widest block mb-0.5">SOAL ${idx+1}</span>
                                <div class="text-[11px] md:text-sm font-bold text-slate-700 truncate">Jawab: <span class="${isBenar?'text-emerald-700':'text-rose-700'}">${jwb}</span></div>
                                <div class="text-[8px] md:text-[10px] font-bold text-slate-400 mt-0.5 truncate">Kunci: ${soal.kunci||'-'}</div>
                            </div>
                            <div class="w-7 h-7 md:w-10 md:h-10 flex shrink-0 items-center justify-center rounded-full text-white shadow-inner ${isBenar ? 'bg-emerald-500 shadow-emerald-600' : 'bg-rose-500 shadow-rose-600'}">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="w-3 h-3 md:w-5 md:h-5">${isBenar ? '<polyline points="20 6 9 17 4 12"></polyline>' : '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>'}</svg>
                            </div>
                        </div>`;
                } else {
                    countEsai++;
                    const nilai = ans[`${soal.id}_score`] || 0;
                    htmlEsai += `
                        <div class="p-3 md:p-5 bg-slate-50 rounded-xl md:rounded-2xl border border-slate-200 relative overflow-hidden group">
                            <div class="absolute top-0 left-0 w-1 md:w-1.5 h-full bg-amber-400"></div>
                            <div class="font-semibold text-slate-800 text-[11px] md:text-sm mb-2 md:mb-3 katex-render pl-2 md:pl-3">${soal.pertanyaan}</div>
                            
                            <div class="bg-white p-3 md:p-4 rounded-lg md:rounded-xl border border-slate-100 shadow-sm ml-2 md:ml-3 relative">
                                <p class="text-[11px] md:text-sm font-medium text-slate-600 whitespace-pre-wrap relative z-10">${jwb ? jwb : '<i class="text-slate-300">Tidak ada jawaban.</i>'}</p>
                            </div>
                            <div class="mt-2 md:mt-3 ml-2 md:ml-3 flex justify-end">
                                <span class="bg-amber-100 text-amber-800 px-2 py-1 rounded border border-amber-200 text-[9px] font-black">NILAI MENTAH: ${nilai}</span>
                            </div>
                        </div>`;
                }
            });

            if(countPG === 0) htmlPG += `<div class="col-span-full text-center text-xs text-slate-400 font-bold p-3">Tidak ada soal PG.</div>`;
            if(countEsai === 0) htmlEsai += `<div class="text-center text-xs text-slate-400 font-bold p-3">Tidak ada soal Esai.</div>`;
            
            htmlPG += `</div></div>`; htmlEsai += `</div></div>`;
            content.innerHTML = htmlPG + htmlEsai;
            if(window.renderMathInElement) renderMathInElement(content, { delimiters: [{left:"$",right:"$",display:false}, {left:"$$",right:"$$",display:true}] });
        };

        window.koreksiSiswa = async (id, tokenSesi) => {
            const student = rawData.find(r => r.id === id);
            if(!student) return;
            activeStudentId = id; 

            const { data: sesi } = await supabase.from('exam_sessions').select('bobot_pg, bobot_esai').eq('token', tokenSesi).single();
            if(sesi) { bobotPG_Aktif = sesi.bobot_pg || 40; bobotEsai_Aktif = sesi.bobot_esai || 60; }

            document.getElementById('koreksi-name').innerText = student.student_name + ` (PG: ${bobotPG_Aktif}% | Esai: ${bobotEsai_Aktif}%)`;
            document.getElementById('modal-koreksi').classList.remove('hidden'); document.getElementById('modal-koreksi').classList.add('flex');
            const content = document.getElementById('koreksi-content');
            content.innerHTML = '<div class="text-center p-6 font-bold text-amber-400 animate-pulse text-xs md:text-sm">Menyiapkan Lembar Koreksi...</div>';

            const { data: soalList } = await supabase.from('bank_soal')
                .select('id, pertanyaan, kunci')
                .eq('mapel', student.mapel)
                .eq('kelas', student.kelas)
                .eq('jenis_soal', 'ESAI')
                .eq('teacher_email', teacherEmail); 
            
            if(!soalList || soalList.length === 0) {
                content.innerHTML = '<div class="text-center p-6 text-slate-500 font-bold bg-white rounded-xl text-xs md:text-sm">Sesi ini tidak mengandung Soal Esai.</div>';
                document.getElementById('btn-simpan-koreksi').classList.add('hidden'); return;
            }

            document.getElementById('btn-simpan-koreksi').classList.remove('hidden');
            const ans = student.answers || {};
            let htmlForm = '';

            soalList.forEach((soal, idx) => {
                const jwb = ans[soal.id] || '';
                const currentScore = ans[`${soal.id}_score`] || 0;
                
                htmlForm += `
                    <div class="bg-white p-3 md:p-6 rounded-[1.25rem] md:rounded-[1.5rem] border border-slate-200 shadow-sm relative overflow-hidden group mb-4">
                        <div class="absolute top-0 left-0 w-1 md:w-1.5 h-full bg-blue-500"></div>
                        <div class="flex flex-col md:flex-row gap-3 md:gap-6 ml-1.5 md:ml-2">
                            <div class="flex-1 min-w-0">
                                <p class="text-[8px] md:text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5 md:mb-2">PERTANYAAN NO ${idx+1}</p>
                                <div class="font-semibold text-slate-800 text-[11px] md:text-sm mb-3 md:mb-4 katex-render bg-slate-50 p-2.5 md:p-4 rounded-lg md:rounded-xl border border-slate-100 overflow-x-auto">${soal.pertanyaan}</div>
                                
                                <p class="text-[8px] md:text-[10px] font-black text-blue-500 uppercase tracking-widest mb-1 md:mb-1.5">JAWABAN SISWA:</p>
                                <div class="bg-white p-2.5 md:p-4 rounded-lg md:rounded-xl border-2 border-blue-100 relative overflow-x-auto">
                                    <p class="text-[11px] md:text-sm font-medium text-slate-700 whitespace-pre-wrap">${jwb ? jwb : '<i class="text-slate-300">Siswa tidak memberikan jawaban.</i>'}</p>
                                </div>
                            </div>
                            <div class="w-full md:w-40 shrink-0 bg-slate-50 p-3 md:p-4 rounded-lg md:rounded-2xl border border-slate-100 flex flex-row md:flex-col items-center justify-between md:justify-center gap-2 md:gap-3">
                                <label class="text-[8px] md:text-[10px] font-black text-slate-500 uppercase tracking-widest text-left md:text-center leading-tight">Beri Nilai<br class="hidden md:block"/>(Max 100)</label>
                                <input type="number" min="0" max="100" data-soalid="${soal.id}" value="${currentScore}" class="input-nilai-esai w-14 h-14 md:w-20 md:h-20 p-1 md:p-2 bg-white border-2 md:border-[3px] border-emerald-400 rounded-lg md:rounded-[1.5rem] text-lg md:text-2xl font-black text-emerald-600 text-center outline-none focus:border-emerald-600 focus:scale-110 transition-all shadow-inner" placeholder="0">
                            </div>
                        </div>
                    </div>
                `;
            });

            content.innerHTML = htmlForm;
            if(window.renderMathInElement) renderMathInElement(content, { delimiters: [{left:"$",right:"$",display:false}, {left:"$$",right:"$$",display:true}] });
        };

        document.getElementById('btn-simpan-koreksi').onclick = async () => {
            if(!activeStudentId) return;
            const btn = document.getElementById('btn-simpan-koreksi');
            btn.innerHTML = `MENGKALKULASI...`; btn.disabled = true;

            const student = rawData.find(r => r.id === activeStudentId);
            let updatedAnswers = { ...(student.answers || {}) };
            let totalEsaiMentah = 0; let jumlahSoalEsai = 0;
            const inputs = document.querySelectorAll('.input-nilai-esai');
            
            inputs.forEach(input => {
                const sId = input.getAttribute('data-soalid');
                let val = parseInt(input.value) || 0;
                if(val > 100) val = 100; if(val < 0) val = 0;
                
                updatedAnswers[`${sId}_score`] = val;
                totalEsaiMentah += val; jumlahSoalEsai++;
            });

            const rataRataEsai = jumlahSoalEsai > 0 ? (totalEsaiMentah / jumlahSoalEsai) : 0;
            const nilaiPGMentah = student.objective_score || 0;
            const finalScore = (nilaiPGMentah * (bobotPG_Aktif / 100)) + (rataRataEsai * (bobotEsai_Aktif / 100));

            const { error } = await supabase.from('leaderboard').update({
                answers: updatedAnswers, essay_score: Math.round(rataRataEsai), score: Math.round(finalScore), is_essay_graded: true
            }).eq('id', activeStudentId);

            if(error) { alert("Gagal menyimpan nilai: " + error.message); } 
            else { document.getElementById('modal-koreksi').classList.replace('flex','hidden'); await loadLeaderboard(); alert("Tersimpan!"); }

            btn.innerHTML = `SIMPAN NILAI AKHIR`; btn.disabled = false;
        };

        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
