<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Guru | Teacher Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../../css/global.css">
    <style>@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap'); body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="flex h-screen bg-[#F8FAFC] overflow-hidden font-sans text-slate-800 w-full max-w-[100vw]">
    <div id="sidebar-container"></div>
    <main class="flex-1 flex flex-col h-screen overflow-hidden relative z-0 w-full">
        <header class="bg-white border-b border-slate-200 p-4 md:px-6 lg:px-8 flex justify-between items-center z-10 sticky top-0 shadow-sm w-full gap-4">
           <div class="flex items-center gap-3 flex-1 overflow-hidden pr-2">
             <button id="open-sidebar" class="md:hidden p-2 bg-slate-100 rounded-lg text-emerald-600 hover:bg-slate-200 transition-colors shrink-0">
                 <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
             </button>
             <h2 class="text-[11px] md:text-xs lg:text-sm font-black text-slate-800 uppercase tracking-widest line-clamp-2 leading-snug break-words" id="topbar-school-name">Teacher Center V3</h2>
           </div>
           <div class="flex items-center gap-3 shrink-0">
               <div class="hidden md:flex items-center gap-1.5 bg-emerald-50 px-3 py-1.5 rounded-full border border-emerald-100 mr-2">
                 <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span><span class="text-[10px] font-black text-emerald-700 uppercase tracking-widest">Sistem Stabil</span>
               </div>
               <div class="text-right hidden md:block">
                   <p class="text-xs font-bold text-slate-800 truncate max-w-[120px]" id="user-name">Memuat...</p>
                   <p class="text-[9px] font-black text-emerald-600 uppercase tracking-widest">Guru Mapel</p>
               </div>
               <div class="w-9 h-9 md:w-10 md:h-10 rounded-full bg-emerald-100 border border-emerald-200 flex items-center justify-center text-emerald-700 font-black shrink-0" id="user-initial">G</div>
           </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 custom-scrollbar w-full">
            <div class="max-w-6xl mx-auto space-y-6 animate-in fade-in duration-500 pb-10">
               
               <div class="bg-emerald-600 rounded-[24px] p-6 md:p-10 text-white shadow-xl shadow-emerald-600/20 relative overflow-hidden">
                  <div class="absolute right-0 top-0 opacity-10 transform translate-x-10 -translate-y-5 pointer-events-none"><svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg></div>
                  <div class="relative z-10">
                      <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-white/20 border border-white/30 text-white text-[10px] font-black uppercase tracking-widest mb-4 backdrop-blur-sm shadow-sm">Pusat Kendali Pengajar</div>
                      <h2 class="text-3xl md:text-4xl lg:text-5xl font-black text-white mb-3 tracking-tight leading-tight">Selamat Datang, <br class="md:hidden"/><span id="welcome-name">Guru</span>!</h2>
                      <p class="text-emerald-100 font-medium text-sm md:text-base max-w-2xl leading-relaxed">Kelola soal, pantau ujian, dan rekap nilai siswa Anda dengan cepat dan terpusat di sini.</p>
                  </div>
               </div>

               <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-5">
                  <div class="bg-white p-4 md:p-5 rounded-[20px] border border-slate-200 shadow-sm flex flex-col justify-between h-full min-h-[120px] hover:border-blue-400 group transition-all">
                     <div class="flex items-center justify-between mb-3"><div class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center group-hover:scale-110 transition-transform"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg></div><span class="text-[9px] font-bold text-slate-400 bg-slate-50 px-2 py-0.5 rounded border">Bank</span></div>
                     <div class="mt-auto"><p class="text-[9px] md:text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 leading-snug">Total Soal Saya</p><h3 class="text-2xl md:text-3xl font-black text-slate-800 leading-none" id="stat-soal">0</h3></div>
                  </div>
                  <div class="bg-white p-4 md:p-5 rounded-[20px] border border-slate-200 shadow-sm flex flex-col justify-between h-full min-h-[120px] hover:border-emerald-400 group transition-all">
                     <div class="flex items-center justify-between mb-3"><div class="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center group-hover:scale-110 transition-transform"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg></div><span class="text-[9px] font-bold text-emerald-500 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-100 flex items-center gap-1"><span class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></span>Live</span></div>
                     <div class="mt-auto"><p class="text-[9px] md:text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 leading-snug">Sesi Berjalan</p><h3 class="text-2xl md:text-3xl font-black text-slate-800 leading-none" id="stat-live">0</h3></div>
                  </div>
                  <div class="bg-white p-4 md:p-5 rounded-[20px] border border-slate-200 shadow-sm flex flex-col justify-between h-full min-h-[120px] hover:border-amber-400 group transition-all">
                     <div class="flex items-center justify-between mb-3"><div class="w-8 h-8 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center group-hover:scale-110 transition-transform"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></div><span class="text-[9px] font-bold text-slate-400 bg-slate-50 px-2 py-0.5 rounded border">Ujian</span></div>
                     <div class="mt-auto"><p class="text-[9px] md:text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 leading-snug">Siswa Ujian</p><h3 class="text-2xl md:text-3xl font-black text-slate-800 leading-none" id="stat-siswa">0</h3></div>
                  </div>
                  <div class="bg-white p-4 md:p-5 rounded-[20px] border border-slate-200 shadow-sm flex flex-col justify-between h-full min-h-[120px] hover:border-purple-400 group transition-all">
                     <div class="flex items-center justify-between mb-3"><div class="w-8 h-8 rounded-lg bg-purple-50 text-purple-600 flex items-center justify-center group-hover:scale-110 transition-transform"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></div><span class="text-[9px] font-bold text-slate-400 bg-slate-50 px-2 py-0.5 rounded border">Jadwal</span></div>
                     <div class="mt-auto"><p class="text-[9px] md:text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 leading-snug">Total Sesi Dibuat</p><h3 class="text-2xl md:text-3xl font-black text-slate-800 leading-none" id="stat-sesi">0</h3></div>
                  </div>
               </div>
            </div>
        </div>
    </main>
    <script type="module">
        import { supabase } from '../../js/config/supabase.js';
        import { renderGuruSidebar } from '../../js/components/sidebar-guru.js';
        renderGuruSidebar();

        async function initPage() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) return window.location.href = '../auth/login.html';
            const { data: profile } = await supabase.from('users').select('*').eq('id', session.user.id).single();
            if (!profile || (profile.role !== 'teacher' && profile.role !== 'proctor')) return window.location.href = '../auth/login.html';
            
            document.getElementById('user-name').innerText = profile.name;
            document.getElementById('welcome-name').innerText = profile.name.split(' ')[0];
            document.getElementById('user-initial').innerText = profile.name.charAt(0).toUpperCase();

            const [{count:cSoal}, {count:cLive}, {count:cSiswa}, {count:cSesi}] = await Promise.all([
                supabase.from('bank_soal').select('*', {count:'exact', head:true}).eq('teacher_email', profile.email),
                supabase.from('exam_sessions').select('*', {count:'exact', head:true}).eq('teacher_email', profile.email).eq('status','open'),
                supabase.from('leaderboard').select('*', {count:'exact', head:true}).eq('teacher_email', profile.email),
                supabase.from('exam_sessions').select('*', {count:'exact', head:true}).eq('teacher_email', profile.email)
            ]);

            document.getElementById('stat-soal').innerText = cSoal || 0;
            document.getElementById('stat-live').innerText = cLive || 0;
            document.getElementById('stat-siswa').innerText = cSiswa || 0;
            document.getElementById('stat-sesi').innerText = cSesi || 0;
        }
        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
