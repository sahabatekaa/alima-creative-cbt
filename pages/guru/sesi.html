<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Sesi Ujian | Teacher Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../../css/global.css">
    <style>@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;900&display=swap'); body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="flex h-screen bg-[#F8FAFC] overflow-hidden font-sans text-slate-800">
    <div id="sidebar-container"></div>
    
    <main class="flex-1 flex flex-col h-screen overflow-hidden relative w-full">
        <header class="bg-white border-b border-slate-200 p-4 md:px-6 flex justify-between items-center z-10 sticky top-0 shadow-sm">
           <div class="flex items-center gap-3">
             <button id="open-sidebar" class="md:hidden p-2 bg-slate-100 rounded-lg text-emerald-600"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
             <h2 class="text-xs md:text-sm font-black text-slate-800 uppercase tracking-widest">Teacher Center V3</h2>
           </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 custom-scrollbar">
            <div class="max-w-6xl mx-auto space-y-6 pb-10">
                <div class="bg-white p-5 md:p-6 rounded-[24px] shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <h3 class="text-xl font-black text-slate-800 flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-emerald-500"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> Sesi Ujian Aktif</h3>
                        <p class="text-xs font-bold text-slate-400 mt-1">Rilis token ujian berdasarkan Bank Soal yang telah Anda buat.</p>
                    </div>
                    <button id="btn-tambah-sesi" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-3 rounded-xl text-xs font-black shadow-lg shadow-emerald-600/20 active:scale-95 transition-all flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg> Buat Sesi Baru
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="sesi-grid">
                    <div class="col-span-full text-center p-10 font-bold text-slate-400 border-2 border-dashed border-slate-200 rounded-[24px]">Memuat data sesi...</div>
                </div>
            </div>
        </div>
    </main>

    <div id="modal-sesi" class="fixed inset-0 bg-slate-900/90 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] w-full max-w-xl shadow-2xl overflow-hidden flex flex-col">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h2 class="text-xl font-black text-slate-800" id="modal-title">Rilis Sesi Ujian</h2>
                <button id="btn-close-modal" class="text-slate-400 hover:text-red-500 transition-colors"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
            </div>
            
            <form id="form-sesi" class="p-6 space-y-5">
                <input type="hidden" id="edit-token">
                
                <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                    <label class="text-[10px] font-black text-blue-800 uppercase tracking-widest block mb-2">1. Pilih Sumber Soal (Otomatis dari Bank Soal)</label>
                    <select id="s_mapel_kelas" required class="w-full p-3 bg-white border border-blue-200 rounded-lg text-sm font-bold text-slate-800 outline-none focus:border-blue-500 cursor-pointer">
                        <option value="">-- Sedang mencari soal Anda... --</option>
                    </select>
                    <p id="info-soal" class="text-xs font-bold text-blue-600 mt-2 hidden">Jumlah Soal Ditemukan: <span id="count-soal" class="font-black text-lg">0</span></p>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest block mb-1">Sub Kelas (Opsional)</label>
                        <input type="text" id="s_sub" placeholder="Cth: A / B / IPA 1" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-800 uppercase outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest block mb-1">Durasi Waktu</label>
                        <div class="flex items-center bg-slate-50 border border-slate-200 rounded-xl overflow-hidden focus-within:border-emerald-500">
                            <input type="number" id="s_durasi" required min="10" value="90" class="w-full p-3 bg-transparent text-sm font-bold text-slate-800 outline-none text-right">
                            <span class="px-3 text-xs font-bold text-slate-400 bg-slate-100 border-l border-slate-200 h-full flex items-center">Menit</span>
                        </div>
                    </div>
                </div>

                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest block mb-3">Pengaturan Bobot Penilaian (%)</label>
                    <div class="grid grid-cols-2 gap-4">
                        <div><p class="text-xs font-bold text-slate-500 mb-1">Bobot Pilihan Ganda</p><input type="number" id="s_bobot_pg" required min="0" max="100" value="100" class="w-full p-3 border border-slate-200 rounded-lg text-sm font-bold text-slate-800 text-center outline-none"></div>
                        <div><p class="text-xs font-bold text-slate-500 mb-1">Bobot Esai</p><input type="number" id="s_bobot_esai" required min="0" max="100" value="0" class="w-full p-3 border border-slate-200 rounded-lg text-sm font-bold text-slate-800 text-center outline-none"></div>
                    </div>
                </div>

                <button type="submit" id="btn-simpan-sesi" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-4 rounded-xl font-black text-sm tracking-widest active:scale-95 transition-all shadow-lg shadow-emerald-500/30">BUAT TOKEN SESI</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { supabase } from '../../js/config/supabase.js';
        import { renderGuruSidebar } from '../../js/components/sidebar-guru.js';
        setTimeout(() => renderGuruSidebar(), 100);

        let schoolId = null; let teacherEmail = null;
        let sesiData = []; let bankSoalGrup = [];

        async function initPage() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) return window.location.href = '../auth/login.html';
            const { data: profile } = await supabase.from('users').select('*').eq('id', session.user.id).single();
            schoolId = profile.school_id; teacherEmail = profile.email;
            
            loadSesi();
            loadBankSoal(); // Menjalankan logika BUG 1
        }

        // --- SOLUSI BUG 1: TARIK DATA DARI BANK SOAL ---
        async function loadBankSoal() {
            const { data: soal } = await supabase.from('bank_soal').select('mapel, kelas').eq('teacher_email', teacherEmail);
            if(!soal || soal.length === 0) {
                document.getElementById('s_mapel_kelas').innerHTML = '<option value="">Bank Soal Anda masih kosong!</option>';
                return;
            }

            // Mengelompokkan berdasarkan Mapel dan Kelas, serta menghitung jumlah soal
            const grup = {};
            soal.forEach(s => {
                const key = `${s.mapel}|||${s.kelas}`;
                if(!grup[key]) grup[key] = { mapel: s.mapel, kelas: s.kelas, count: 0 };
                grup[key].count++;
            });

            bankSoalGrup = Object.values(grup);
            document.getElementById('s_mapel_kelas').innerHTML = '<option value="">-- Pilih Mapel & Kelas --</option>' + 
                bankSoalGrup.map((g, i) => `<option value="${i}">${g.mapel} - Kelas ${g.kelas}</option>`).join('');
        }

        document.getElementById('s_mapel_kelas').addEventListener('change', (e) => {
            const idx = e.target.value;
            const infoBox = document.getElementById('info-soal');
            if(idx === '') { infoBox.classList.add('hidden'); return; }
            
            infoBox.classList.remove('hidden');
            document.getElementById('count-soal').innerText = bankSoalGrup[idx].count + ' Soal';
        });

        // --- MANAJEMEN SESI ---
        async function loadSesi() {
            const { data } = await supabase.from('exam_sessions').select('*').eq('teacher_email', teacherEmail).order('created_at', { ascending: false });
            sesiData = data || []; renderSesi();
        }

        function renderSesi() {
            const grid = document.getElementById('sesi-grid');
            if(sesiData.length === 0) return grid.innerHTML = '<div class="col-span-full text-center p-10 font-bold text-slate-400 border-2 border-dashed border-slate-200 rounded-[24px]">Belum ada sesi ujian yang dibuat.</div>';

            grid.innerHTML = sesiData.map(s => `
                <div class="bg-white p-5 rounded-[20px] shadow-sm border ${s.status==='open' ? 'border-emerald-200 ring-2 ring-emerald-50' : 'border-slate-200 opacity-70'} relative overflow-hidden transition-all group">
                    <div class="flex justify-between items-start mb-4">
                        <div class="bg-slate-100 text-slate-800 px-3 py-1.5 rounded-lg text-lg font-black font-mono tracking-[0.2em] border border-slate-200 shadow-inner">${s.token}</div>
                        <span class="text-[9px] font-black px-2.5 py-1 rounded border uppercase tracking-widest ${s.status==='open'?'bg-emerald-100 text-emerald-700 border-emerald-200':'bg-rose-100 text-rose-700 border-rose-200'}">${s.status==='open'?'Aktif':'Ditutup'}</span>
                    </div>
                    <h4 class="font-black text-slate-800 uppercase mb-1 leading-tight">${s.mapel}</h4>
                    <p class="text-xs font-bold text-slate-500 mb-4">Kelas ${s.kelas} ${s.sub_kelas ? '- '+s.sub_kelas : ''}</p>
                    
                    <div class="bg-slate-50 rounded-xl p-3 grid grid-cols-2 gap-2 text-xs font-bold text-slate-600 mb-4 border border-slate-100">
                        <div class="flex items-center gap-1.5"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-blue-500"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> ${s.durasi || 90} Menit</div>
                        <div class="flex items-center gap-1.5"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-amber-500"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line></svg> ${s.jumlah_soal || '-'} Soal</div>
                        <div class="col-span-2 flex items-center gap-1.5 text-[10px] mt-1"><span class="bg-blue-100 text-blue-700 px-1.5 rounded">PG: ${s.bobot_pg||100}%</span> <span class="bg-amber-100 text-amber-700 px-1.5 rounded">Esai: ${s.bobot_esai||0}%</span></div>
                    </div>

                    <div class="flex gap-2">
                        <button onclick="toggleSesi('${s.token}', '${s.status}')" class="flex-1 py-2.5 rounded-xl font-black text-[10px] uppercase tracking-wider transition-colors ${s.status==='open' ? 'bg-rose-50 text-rose-600 hover:bg-rose-100' : 'bg-emerald-50 text-emerald-600 hover:bg-emerald-100'}">${s.status==='open' ? 'Tutup Sesi' : 'Buka Sesi'}</button>
                        <button onclick="hapusSesi('${s.token}')" class="p-2.5 bg-slate-50 hover:bg-red-50 text-slate-400 hover:text-red-500 rounded-xl transition-colors border border-slate-200"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
                    </div>
                </div>
            `).join('');
        }

        const modal = document.getElementById('modal-sesi');
        document.getElementById('btn-tambah-sesi').onclick = () => { document.getElementById('form-sesi').reset(); document.getElementById('edit-token').value=''; document.getElementById('info-soal').classList.add('hidden'); modal.classList.remove('hidden'); modal.classList.add('flex'); };
        document.getElementById('btn-close-modal').onclick = () => { modal.classList.remove('flex'); modal.classList.add('hidden'); };

        window.toggleSesi = async (token, currentStatus) => {
            const newStatus = currentStatus === 'open' ? 'closed' : 'open';
            await supabase.from('exam_sessions').update({ status: newStatus }).eq('token', token);
            loadSesi();
        };

        window.hapusSesi = async (token) => {
            if(confirm('Hapus sesi ujian ini permanen? Data siswa yang sedang ujian di sesi ini bisa terganggu!')) {
                await supabase.from('exam_sessions').delete().eq('token', token); loadSesi();
            }
        };

        document.getElementById('form-sesi').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-simpan-sesi'); btn.innerText = "MENYIMPAN..."; btn.disabled = true;

            const idxSoal = document.getElementById('s_mapel_kelas').value;
            if(!idxSoal) { alert("Pilih sumber soal dari Bank Soal terlebih dahulu!"); btn.innerText = "BUAT TOKEN SESI"; btn.disabled = false; return; }

            const mapel = bankSoalGrup[idxSoal].mapel;
            const kelas = bankSoalGrup[idxSoal].kelas;
            const jumlah_soal = bankSoalGrup[idxSoal].count;
            
            const sub = document.getElementById('s_sub').value.toUpperCase();
            const durasi = document.getElementById('s_durasi').value;
            const bobotPg = document.getElementById('s_bobot_pg').value;
            const bobotEsai = document.getElementById('s_bobot_esai').value;

            // Generate Token Cerdas
            const token = Math.random().toString(36).substr(2, 5).toUpperCase();
            
            // Kalkulasi Jam Selesai berbasis Durasi
            const d = new Date(); d.setMinutes(d.getMinutes() + parseInt(durasi));
            const jam_selesai = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

            const payload = {
                token: token, school_id: schoolId, teacher_email: teacherEmail,
                mapel: mapel, kelas: kelas, sub_kelas: sub,
                durasi: parseInt(durasi), bobot_pg: parseInt(bobotPg), bobot_esai: parseInt(bobotEsai),
                jumlah_soal: jumlah_soal, jam_mulai: '00:00', jam_selesai: jam_selesai, status: 'open'
            };

            await supabase.from('exam_sessions').insert([payload]);
            modal.classList.remove('flex'); modal.classList.add('hidden');
            loadSesi();
        };

        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
