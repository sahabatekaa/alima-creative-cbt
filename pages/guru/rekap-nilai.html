<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Nilai | Teacher Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="../../css/global.css">
    <style>@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap'); body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="flex h-screen bg-[#F8FAFC] overflow-hidden font-sans text-slate-800">
    <div id="sidebar-container"></div>
    <main class="flex-1 flex flex-col h-screen overflow-hidden relative w-full">
        <header class="bg-white border-b border-slate-200 p-4 md:px-6 flex justify-between items-center z-10 sticky top-0 shadow-sm">
           <div class="flex items-center gap-3">
             <button id="open-sidebar" class="md:hidden p-2 bg-slate-100 rounded-lg text-emerald-600"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
             <h2 class="text-xs md:text-sm font-black text-slate-800 uppercase tracking-widest">Teacher Center V3</h2>
           </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 custom-scrollbar">
            <div class="max-w-6xl mx-auto space-y-6 pb-10">
                <div class="bg-white p-5 md:p-6 rounded-[24px] shadow-sm border border-slate-200 space-y-4">
                    <div class="flex flex-col md:flex-row justify-between md:items-center gap-4 border-b border-slate-100 pb-4">
                        <div>
                            <h3 class="text-xl font-black text-slate-800 flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-emerald-500"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg> Rekapitulasi & Cetak Nilai</h3>
                            <p class="text-xs font-bold text-slate-400 mt-1">Saring sesi ujian sebelum mencetak dokumen atau koreksi esai.</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <select id="filter-mapel" class="p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:border-emerald-500"><option value="">-- Pilih Mapel --</option></select>
                        <select id="filter-kelas" class="p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:border-emerald-500"><option value="">-- Pilih Kelas --</option></select>
                        <select id="filter-token" class="p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:border-emerald-500"><option value="">-- Pilih Token Sesi --</option></select>
                    </div>
                    <div class="flex flex-wrap gap-2 pt-2">
                        <button id="btn-export-excel" class="bg-emerald-50 text-emerald-700 border border-emerald-200 px-4 py-2.5 rounded-xl text-xs font-black shadow-sm active:scale-95 flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> Cetak Daftar Nilai (Excel)</button>
                        <button id="btn-koreksi-esai" class="bg-amber-400 hover:bg-amber-500 text-white px-4 py-2.5 rounded-xl text-xs font-black shadow-sm active:scale-95 flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg> Koreksi Esai Manual</button>
                    </div>
                </div>

                <div class="bg-white rounded-[24px] border border-slate-200 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto custom-scrollbar">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="bg-slate-50 text-slate-500 border-b border-slate-200 text-[10px] uppercase font-black tracking-wider">
                                <tr>
                                    <th class="p-4">Identitas Siswa</th>
                                    <th class="p-4 text-center">Kelas/Token</th>
                                    <th class="p-4 text-center">Mapel</th>
                                    <th class="p-4 text-center">PG / Esai</th>
                                    <th class="p-4 text-center">Skor Akhir</th>
                                </tr>
                            </thead>
                            <tbody id="nilai-body" class="divide-y divide-slate-100">
                                <tr><td colspan="5" class="p-10 text-center text-slate-400 font-bold">Pilih Mapel, Kelas, dan Token untuk melihat nilai.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="modal-esai" class="fixed inset-0 bg-slate-900/90 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] w-full max-w-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-amber-50">
                <div>
                    <h2 class="text-lg font-black text-amber-900 flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg> Koreksi Esai Cepat</h2>
                    <p id="esai-progress" class="text-xs font-bold text-amber-700 mt-1">Memuat data...</p>
                </div>
                <button id="btn-close-esai" class="p-2 bg-white rounded-full text-slate-400 hover:text-red-500 shadow-sm"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
            </div>
            
            <div id="esai-content" class="p-6 overflow-y-auto flex-1 space-y-5 bg-slate-50">
                </div>

            <div class="p-5 border-t border-slate-200 bg-white flex gap-3 items-center">
                <div class="flex-1">
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest block mb-1">Beri Nilai (0 - 100)</label>
                    <input type="number" id="input-skor-esai" min="0" max="100" class="w-full p-3 bg-amber-50 border border-amber-200 rounded-xl text-lg font-black text-amber-900 text-center outline-none focus:border-amber-500" placeholder="0">
                </div>
                <button id="btn-simpan-esai" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white py-4 rounded-xl font-black text-sm tracking-widest active:scale-95 transition-all shadow-lg shadow-amber-500/30">SIMPAN & LANJUT</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from '../../js/config/supabase.js';
        import { renderGuruSidebar } from '../../js/components/sidebar-guru.js';
        renderGuruSidebar();

        let schoolId = null;
        let teacherEmail = null;
        let leaderboardData = [];
        let esaiTasks = [];
        let currentTaskIdx = 0;

        async function initPage() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) return window.location.href = '../auth/login.html';
            const { data: profile } = await supabase.from('users').select('*').eq('id', session.user.id).single();
            schoolId = profile.school_id; teacherEmail = profile.email;
            
            // Muat Filter Mapel & Kelas
            const [{data: mapels}, {data: kelas}, {data: sesi}] = await Promise.all([
                supabase.from('master_subjects').select('name').eq('school_id', schoolId),
                supabase.from('master_classes').select('name').eq('school_id', schoolId),
                supabase.from('exam_sessions').select('token').eq('teacher_email', teacherEmail)
            ]);

            if(mapels) document.getElementById('filter-mapel').innerHTML += mapels.map(m => `<option value="${m.name}">${m.name}</option>`).join('');
            if(kelas) document.getElementById('filter-kelas').innerHTML += kelas.map(k => `<option value="${k.name}">${k.name}</option>`).join('');
            if(sesi) document.getElementById('filter-token').innerHTML += sesi.map(s => `<option value="${s.token}">${s.token}</option>`).join('');
        }

        async function loadData() {
            const m = document.getElementById('filter-mapel').value;
            const k = document.getElementById('filter-kelas').value;
            const t = document.getElementById('filter-token').value;
            
            if(!m || !k || !t) return;
            document.getElementById('nilai-body').innerHTML = '<tr><td colspan="5" class="p-10 text-center text-slate-400 font-bold">Mencari data...</td></tr>';

            const { data } = await supabase.from('leaderboard').select('*').eq('teacher_email', teacherEmail).eq('mapel', m).eq('kelas', k).eq('token', t);
            leaderboardData = data || [];
            
            if(leaderboardData.length === 0) {
                document.getElementById('nilai-body').innerHTML = '<tr><td colspan="5" class="p-10 text-center text-slate-400 font-bold">Belum ada siswa yang mengumpulkan nilai di sesi ini.</td></tr>';
                return;
            }

            document.getElementById('nilai-body').innerHTML = leaderboardData.map(row => {
                const pg = row.objective_score || 0;
                const es = row.essay_score || 0;
                const total = row.score || 0;
                return `
                <tr class="hover:bg-slate-50 transition-colors border-b border-slate-50">
                    <td class="p-4"><p class="font-black text-slate-800 text-sm uppercase">${row.student_name}</p></td>
                    <td class="p-4 text-center"><span class="bg-slate-100 text-slate-600 px-2 py-1 rounded text-[10px] font-bold border">${row.kelas}-${row.sub_kelas} / ${row.token}</span></td>
                    <td class="p-4 text-center font-bold text-slate-600 text-xs">${row.mapel}</td>
                    <td class="p-4 text-center font-bold text-slate-500 text-xs">PG: ${pg} | E: ${es}</td>
                    <td class="p-4 text-center"><span class="text-base font-black ${total < 70 ? 'text-red-500' : 'text-emerald-600'}">${total}</span></td>
                </tr>
            `}).join('');
        }

        ['filter-mapel', 'filter-kelas', 'filter-token'].forEach(id => {
            document.getElementById(id).addEventListener('change', loadData);
        });

        // --- LOGIKA KOREKSI ESAI ---
        document.getElementById('btn-koreksi-esai').onclick = async () => {
            const m = document.getElementById('filter-mapel').value;
            const k = document.getElementById('filter-kelas').value;
            const t = document.getElementById('filter-token').value;
            
            if(!m || !k || !t) return alert("Pilih Mapel, Kelas, dan Token terlebih dahulu!");
            if(leaderboardData.length === 0) return alert("Tidak ada data siswa untuk dikoreksi.");

            document.getElementById('esai-progress').innerText = "Menyiapkan lembar jawaban...";
            document.getElementById('modal-esai').classList.remove('hidden'); document.getElementById('modal-esai').classList.add('flex');
            document.getElementById('esai-content').innerHTML = '<div class="text-center text-slate-400 p-10 font-bold">Membuka lembar jawaban...</div>';

            // Ambil semua soal esai untuk mapel ini
            const { data: soalEsai } = await supabase.from('bank_soal').select('id, pertanyaan, opsi_a').eq('mapel', m).eq('kelas', k).eq('jenis_soal', 'ESAI').eq('teacher_email', teacherEmail);
            
            if(!soalEsai || soalEsai.length === 0) {
                document.getElementById('esai-content').innerHTML = '<div class="text-center text-red-400 p-10 font-bold">Tidak ada tipe soal ESAI di bank soal ini.</div>';
                return;
            }

            // Susun antrean tugas koreksi
            esaiTasks = [];
            leaderboardData.forEach(student => {
                const ansObj = student.answers || {};
                soalEsai.forEach(soal => {
                    const studentAnswer = ansObj[soal.id] || '';
                    if(studentAnswer.trim() !== '') {
                        esaiTasks.push({
                            leaderboard_id: student.id,
                            student_name: student.student_name,
                            question_id: soal.id,
                            pertanyaan: soal.pertanyaan,
                            kunci: soal.opsi_a, // Kolom opsi_a bisa dipakai guru untuk simpan acuan jawaban
                            jawaban_siswa: studentAnswer,
                            current_score: ansObj[`${soal.id}_score`] || 0
                        });
                    }
                });
            });

            if(esaiTasks.length === 0) {
                document.getElementById('esai-content').innerHTML = '<div class="text-center text-slate-400 p-10 font-bold">Semua siswa mengosongkan jawaban esainya.</div>';
                return;
            }

            currentTaskIdx = 0;
            renderEsaiTask();
        };

        function renderEsaiTask() {
            if(currentTaskIdx >= esaiTasks.length) {
                document.getElementById('esai-content').innerHTML = '<div class="text-center text-emerald-500 p-10"><svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="mx-auto mb-4"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg><h2 class="text-2xl font-black">Selesai!</h2><p class="font-bold text-slate-500 mt-2">Semua esai telah dikoreksi.</p></div>';
                document.getElementById('btn-simpan-esai').classList.add('hidden');
                document.getElementById('input-skor-esai').parentElement.classList.add('hidden');
                document.getElementById('esai-progress').innerText = "Tuntas 100%";
                loadData(); // Refresh tabel belakang
                return;
            }

            const task = esaiTasks[currentTaskIdx];
            document.getElementById('esai-progress').innerText = `Koreksi ke-${currentTaskIdx + 1} dari ${esaiTasks.length}`;
            
            document.getElementById('esai-content').innerHTML = `
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Nama Siswa</p>
                    <p class="text-lg font-black text-blue-600">${task.student_name}</p>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Pertanyaan Esai</p>
                    <p class="font-semibold text-slate-800 text-sm whitespace-pre-wrap">${task.pertanyaan}</p>
                    ${task.kunci ? `<div class="mt-3 p-3 bg-emerald-50 border border-emerald-100 rounded-lg text-xs font-medium text-emerald-800"><span class="font-bold">Acuan Jawaban Guru:</span><br>${task.kunci}</div>` : ''}
                </div>
                <div class="bg-amber-100/50 p-5 rounded-2xl border-2 border-amber-200 shadow-inner">
                    <p class="text-[10px] font-black text-amber-700 uppercase tracking-widest mb-2">Jawaban Siswa</p>
                    <p class="font-medium text-slate-800 text-base whitespace-pre-wrap leading-relaxed">${task.jawaban_siswa}</p>
                </div>
            `;
            
            document.getElementById('input-skor-esai').value = task.current_score;
            document.getElementById('input-skor-esai').parentElement.classList.remove('hidden');
            document.getElementById('btn-simpan-esai').classList.remove('hidden');
        }

        document.getElementById('btn-simpan-esai').onclick = async () => {
            const task = esaiTasks[currentTaskIdx];
            const newScore = parseInt(document.getElementById('input-skor-esai').value) || 0;
            const btn = document.getElementById('btn-simpan-esai');
            
            btn.innerText = "MENYIMPAN..."; btn.disabled = true;

            // 1. Ambil data siswa dari DB untuk diupdate
            const { data: student } = await supabase.from('leaderboard').select('answers, objective_score').eq('id', task.leaderboard_id).single();
            
            if(student) {
                let ans = student.answers || {};
                ans[`${task.question_id}_score`] = newScore; // Simpan nilai per butir soal
                
                // Hitung ulang total nilai Esai
                let totalEsai = 0;
                Object.keys(ans).forEach(key => { if(key.endsWith('_score')) totalEsai += parseInt(ans[key]); });
                
                // Asumsi pembobotan: PG murni dari objective_score. Total = PG + Esai. 
                // (Guru bisa sesuaikan rumus ini nanti, misal PG 70% Esai 30%)
                const finalScore = (student.objective_score || 0) + totalEsai;

                await supabase.from('leaderboard').update({
                    answers: ans,
                    essay_score: totalEsai,
                    score: finalScore,
                    is_essay_graded: true
                }).eq('id', task.leaderboard_id);
            }

            currentTaskIdx++;
            renderEsaiTask();
            btn.innerText = "SIMPAN & LANJUT"; btn.disabled = false;
        };

        document.getElementById('btn-close-esai').onclick = () => {
            document.getElementById('modal-esai').classList.remove('flex'); document.getElementById('modal-esai').classList.add('hidden');
            loadData(); // Refresh tabel nilai saat ditutup
        };
        
        // --- EXPORT EXCEL ---
        document.getElementById('btn-export-excel').onclick = () => {
            if(leaderboardData.length === 0) return alert("Tidak ada data untuk diekspor.");
            const exportData = leaderboardData.map((r, i) => ({
                'No': i+1, 'Nama Siswa': r.student_name, 'Kelas': r.kelas+'-'+r.sub_kelas, 
                'Mapel': r.mapel, 'Token': r.token, 'Nilai PG': r.objective_score||0, 
                'Nilai Esai': r.essay_score||0, 'SKOR AKHIR': r.score||0
            }));
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Rekap Nilai");
            XLSX.writeFile(wb, `Rekap_Nilai_${document.getElementById('filter-mapel').value}_${document.getElementById('filter-kelas').value}.xlsx`);
        };

        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
