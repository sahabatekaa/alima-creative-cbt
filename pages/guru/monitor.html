<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Live | Teacher Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../../css/global.css">
    <style>@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap'); body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="flex h-[100dvh] bg-[#F8FAFC] overflow-hidden font-sans text-slate-800 w-full max-w-[100vw]">
    <div id="sidebar-container"></div>
    <main class="flex-1 flex flex-col h-full overflow-hidden relative z-0 w-full">
        <header class="bg-white border-b border-slate-200 p-4 md:px-6 flex justify-between items-center z-10 sticky top-0 shadow-sm shrink-0">
           <div class="flex items-center gap-3">
             <button id="open-sidebar" class="md:hidden p-2 bg-slate-100 rounded-lg text-emerald-600"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
             <h2 class="text-xs md:text-sm font-black text-slate-800 uppercase tracking-widest" id="topbar-school-name">Teacher Center V3</h2>
           </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 custom-scrollbar">
            <div class="space-y-5 max-w-7xl mx-auto pb-10">
              <div class="bg-white border border-slate-200 p-4 rounded-[20px] flex flex-col sm:flex-row justify-between gap-4 shadow-sm">
                <div class="flex items-center gap-2 font-black text-slate-800 text-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-emerald-500"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line></svg> Live Proctoring
                </div>
                <select id="select-token" class="w-full sm:w-auto p-3 rounded-xl border border-slate-200 text-sm font-bold bg-slate-50 outline-none">
                    <option value="">-- Pilih Sesi (Token) --</option>
                </select>
              </div>

              <div id="live-dashboard" class="space-y-5 hidden">
                  <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <div class="bg-white p-4 rounded-2xl border-l-4 border-l-blue-500 shadow-sm"><p class="text-slate-500 text-[10px] font-bold uppercase">Terhubung</p><p class="text-3xl font-black" id="stat-hub">0</p></div>
                    <div class="bg-white p-4 rounded-2xl border-l-4 border-l-emerald-500 shadow-sm"><p class="text-slate-500 text-[10px] font-bold uppercase">Selesai</p><p class="text-3xl font-black text-emerald-600" id="stat-selesai">0</p></div>
                    <div class="bg-white p-4 rounded-2xl border-l-4 border-l-red-500 shadow-sm"><p class="text-slate-500 text-[10px] font-bold uppercase">Pelanggaran</p><p class="text-3xl font-black text-red-600" id="stat-curang">0</p></div>
                    <div class="bg-slate-900 p-4 rounded-2xl flex items-center justify-center">
                       <button id="btn-force-all" class="w-full h-full bg-red-600 text-white rounded-xl font-black text-[11px] p-2 flex flex-col items-center justify-center gap-1 active:scale-95"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path></svg>Tarik Paksa Semua</button>
                    </div>
                  </div>
                  
                  <div id="live-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3"></div>
              </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { supabase } from '../../js/config/supabase.js';
        import { renderGuruSidebar } from '../../js/components/sidebar-guru.js';
        setTimeout(() => renderGuruSidebar(), 100);

        let activeToken = '';

        async function initPage() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) return window.location.href = '../auth/login.html';
            const { data: profile } = await supabase.from('users').select('*').eq('id', session.user.id).single();
            const { data: sessions } = await supabase.from('exam_sessions').select('token, mapel, kelas').eq('teacher_email', profile.email).order('created_at', { ascending: false });
            if(sessions) document.getElementById('select-token').innerHTML += sessions.map(s => `<option value="${s.token}">${s.token} (${s.mapel})</option>`).join('');
        }

        document.getElementById('select-token').addEventListener('change', (e) => {
            activeToken = e.target.value;
            if(!activeToken) { document.getElementById('live-dashboard').classList.add('hidden'); return; }
            document.getElementById('live-dashboard').classList.remove('hidden'); fetchLiveStudents();
        });

        async function fetchLiveStudents() {
            if(!activeToken) return;
            const { data: students } = await supabase.from('live_students').select('*').eq('token', activeToken).order('name');
            const grid = document.getElementById('live-grid');
            if(!students || students.length === 0) return grid.innerHTML = '<div class="col-span-full p-10 text-center font-bold text-slate-400">Belum ada peserta login.</div>';

            document.getElementById('stat-hub').innerText = students.length;
            document.getElementById('stat-selesai').innerText = students.filter(s => s.status === 'Selesai').length;
            document.getElementById('stat-curang').innerText = students.filter(s => (s.warnings || 0) > 0).length;

            grid.innerHTML = students.map(s => `
                <div class="bg-white p-4 rounded-2xl border ${s.status === 'Selesai' ? 'border-emerald-200 bg-emerald-50/30' : (s.warnings >= 3 ? 'border-red-400 bg-red-50/30' : 'border-slate-200')} shadow-sm flex flex-col gap-3">
                    <div class="flex justify-between items-start border-b border-slate-100 pb-2">
                        <p class="font-black text-slate-800 text-sm truncate max-w-[140px]">${s.name || '-'}</p>
                        ${(s.warnings || 0) > 0 ? `<span class="bg-red-50 text-red-600 text-[9px] font-black px-1.5 rounded animate-pulse">(!${s.warnings}x)</span>` : ''}
                    </div>
                    <div>
                        <div class="flex justify-between text-[10px] font-bold text-slate-500 mb-1"><span>Progress</span><span class="${s.status === 'Selesai'?'text-emerald-600':'text-blue-600'}">${s.status === 'Selesai' ? '100' : (s.progress || 0)}%</span></div>
                        <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden"><div class="${s.status === 'Selesai'?'bg-emerald-500':'bg-blue-500'} h-full" style="width:${s.status === 'Selesai' ? 100 : (s.progress || 0)}%"></div></div>
                    </div>
                    <div class="flex gap-2 pt-1 border-t mt-1">
                        <button onclick="tarikSiswa('${s.id}')" ${s.status === 'Selesai' || s.force_submit ? 'disabled' : ''} class="flex-1 text-[10px] bg-slate-50 border py-2 rounded-lg font-bold disabled:opacity-50">Tarik Ujian</button>
                        ${(s.warnings || 0) >= 3 && s.status !== 'Selesai' ? `<button onclick="bukaKunci('${s.id}')" class="flex-1 text-[10px] bg-emerald-50 text-emerald-700 py-2 rounded-lg font-bold">Buka Kunci</button>` : ''}
                    </div>
                </div>
            `).join('');
        }

        window.tarikSiswa = async (id) => { await supabase.from('live_students').update({ force_submit: true }).eq('id', id); fetchLiveStudents(); };
        window.bukaKunci = async (id) => { await supabase.from('live_students').update({ warnings: 0, status: 'Online' }).eq('id', id); fetchLiveStudents(); };
        document.getElementById('btn-force-all').onclick = async () => { if(confirm("Tarik semua?")) { await supabase.from('live_students').update({ force_submit: true }).eq('token', activeToken).neq('status', 'Selesai'); fetchLiveStudents(); } };
        
        setInterval(() => { if(activeToken) fetchLiveStudents(); }, 3000);
        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
