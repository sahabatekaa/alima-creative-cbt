<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Prospek | Alima CBT Enterprise</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="../../css/global.css">
</head>
<body class="flex h-screen bg-[#030712] overflow-hidden font-sans text-slate-200 selection:bg-indigo-500/30">

    <div id="sidebar-container"></div>

    <main class="flex-1 flex flex-col h-screen overflow-hidden relative z-0">
        <div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-blue-500/5 rounded-full blur-[120px] pointer-events-none"></div>

        <header class="bg-[#0a0f1c]/70 backdrop-blur-xl border-b border-slate-800/50 p-4 md:p-5 flex justify-between items-center z-10 sticky top-0">
           <div class="flex items-center gap-4">
             <button id="open-sidebar" class="lg:hidden text-indigo-500 hover:text-white transition-colors">
                 <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
             </button>
             <h2 class="text-sm md:text-base font-black text-white tracking-widest uppercase">Leads Pipeline</h2>
           </div>
           <div class="flex items-center gap-2 bg-blue-500/10 border border-blue-500/20 px-3 py-1.5 rounded-lg text-blue-400 text-[10px] font-black uppercase tracking-widest">
             <span id="counter-leads">0</span> Permintaan Baru
           </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-8 z-10 custom-scrollbar">
            <div class="space-y-6 max-w-7xl mx-auto animate-in fade-in duration-500">
                
                <div class="bg-[#0a0f1c] border border-slate-800/80 p-6 rounded-3xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <h3 class="text-xl font-black text-white flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-500"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><polyline points="17 11 19 13 23 9"></polyline></svg>
                            Pendaftaran Klien Baru
                        </h3>
                        <p class="text-sm text-slate-400 mt-1">Daftar prospek sekolah/instansi yang mengajukan integrasi sistem Alima CBT.</p>
                    </div>
                </div>

                <div class="bg-[#0a0f1c] rounded-3xl border border-slate-800/80 overflow-hidden shadow-xl">
                    <div class="overflow-x-auto w-full">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="bg-[#030712] text-slate-400 border-b border-slate-800/50">
                                <tr>
                                    <th class="p-5 font-black uppercase tracking-widest text-[10px]">Data Instansi & PIC</th>
                                    <th class="p-5 font-black uppercase tracking-widest text-[10px]">Paket Pilihan</th>
                                    <th class="p-5 font-black uppercase tracking-widest text-[10px]">Catatan Khusus</th>
                                    <th class="p-5 font-black uppercase tracking-widest text-[10px]">Status Prospek</th>
                                    <th class="p-5 font-black uppercase tracking-widest text-[10px] text-center">Aksi Kendali</th>
                                </tr>
                            </thead>
                            <tbody id="leads-table-body" class="divide-y divide-slate-800/50">
                                <tr>
                                    <td colspan="5" class="p-10 text-center text-slate-500 font-bold">Memuat pipa data prospek...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script type="module">
        import { supabase } from '../../js/config/supabase.js';
        import { renderSidebar } from '../../js/components/sidebar.js';

        // 1. Jalankan komponen menu samping
        renderSidebar();

        // 2. Kunci Keamanan (Auth Guard)
        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = '../auth/login.html';
                return;
            }
            document.getElementById('sidebar-user-email').innerText = session.user.email;
        }
        checkAuth();

        // 3. Ambil Data dari Supabase (Real-Time Real Data)
        async function loadLeadsData() {
            const tbody = document.getElementById('leads-table-body');
            
            try {
                const { data: leads, error } = await supabase
                    .from('registrasi_instansi')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!leads || leads.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-16 text-center border-2 border-dashed border-slate-800 text-slate-500 font-bold">Belum ada sekolah/customer baru yang mendaftar.</td></tr>`;
                    document.getElementById('counter-leads').innerText = 0;
                    return;
                }

                // Hitung jumlah prospek bersatus 'Baru'
                const newLeadsCount = leads.filter(l => l.status_prospek === 'Baru').length;
                document.getElementById('counter-leads').innerText = newLeadsCount;

                // Render Baris Tabel
                let htmlRows = '';
                leads.forEach(item => {
                    // Format Tanggal Masuk
                    const dateObj = new Date(item.created_at);
                    const formattedDate = dateObj.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });

                    // Pengaturan Warna Badge Status
                    let badgeClass = '';
                    if (item.status_prospek === 'Baru') badgeClass = 'bg-rose-500/10 text-rose-400 border-rose-500/20';
                    else if (item.status_prospek === 'Follow Up') badgeClass = 'bg-amber-500/10 text-amber-400 border-amber-500/20';
                    else if (item.status_prospek === 'Deal') badgeClass = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
                    else badgeClass = 'bg-slate-500/10 text-slate-400 border-slate-500/20';

                    // Bersihkan Pesan Tambahan agar tidak merusak layout table
                    const shortMessage = item.pesan_tambahan && item.pesan_tambahan.length > 40 
                        ? item.pesan_tambahan.substring(0, 40) + '...' 
                        : (item.pesan_tambahan || '-');

                    htmlRows += `
                    <tr class="hover:bg-slate-800/10 transition-colors">
                        <td class="p-5">
                            <div class="font-black text-white text-base tracking-tight leading-tight">${item.nama_instansi}</div>
                            <div class="text-xs text-slate-400 mt-1 font-semibold flex items-center gap-1.5">
                                <span class="text-indigo-400">${item.nama_pic}</span> (${item.jabatan})
                            </div>
                            <div class="text-[10px] font-mono text-slate-500 mt-1">Masuk: ${formattedDate}</div>
                        </td>
                        <td class="p-5 font-black text-blue-400 uppercase tracking-wide text-xs">
                            ${item.pilihan_paket}
                        </td>
                        <td class="p-5 text-xs font-medium text-slate-400 max-w-xs truncate" title="${item.pesan_tambahan || ''}">
                            ${shortMessage}
                        </td>
                        <td class="p-5">
                            <select data-id="${item.id}" class="status-selector bg-[#030712] border border-slate-800 rounded-lg text-xs font-bold p-2 outline-none cursor-pointer text-slate-300 focus:border-indigo-500">
                                <option value="Baru" ${item.status_prospek === 'Baru' ? 'selected' : ''}>🔴 Baru (New)</option>
                                <option value="Follow Up" ${item.status_prospek === 'Follow Up' ? 'selected' : ''}>🟡 Follow Up</option>
                                <option value="Deal" ${item.status_prospek === 'Deal' ? 'selected' : ''}>🟢 Deal (Sukses)</option>
                                <option value="Cancel" ${item.status_prospek === 'Cancel' ? 'selected' : ''}>⚫ Cancel</option>
                            </select>
                        </td>
                        <td class="p-5 text-center flex items-center justify-center gap-2.5">
                            <button data-name="${item.nama_pic}" data-school="${item.nama_instansi}" class="btn-chat-lead py-2 px-3.5 bg-emerald-500/10 hover:bg-emerald-500 text-emerald-500 hover:text-white rounded-xl text-xs font-black transition-all border border-emerald-500/20 flex items-center gap-1.5 shadow-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 1 1-7.6-14h.8a8.38 8.38 0 0 1 3.8.9L21 3z"></path></svg>
                                Chat WA
                            </button>
                            <button data-id="${item.id}" data-name="${item.nama_instansi}" class="btn-delete-lead text-rose-500 hover:text-white bg-rose-500/10 hover:bg-rose-500 p-2.5 rounded-xl transition-all border border-rose-500/20">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                            </button>
                        </td>
                    </tr>
                    `;
                });

                tbody.innerHTML = htmlRows;

            } catch (err) {
                console.error("Gagal memuat pipeline leads:", err.message);
                tbody.innerHTML = `<tr><td colspan="5" class="p-10 text-center text-rose-500 font-bold">Error Terkoneksi Database: ${err.message}</td></tr>`;
            }
        }

        // Jalankan fungsi load data saat halaman siap
        setTimeout(loadLeadsData, 200);

        // 4. KUMPULAN EVENT LISTENER (Ubah Status, Chat WA, Hapus)
        document.body.addEventListener('change', async (e) => {
            // A. LOGIKA UBAH STATUS PROSPEK
            if (e.target.classList.contains('status-selector')) {
                const leadId = e.target.getAttribute('data-id');
                const newStatus = e.target.value;

                try {
                    const { error } = await supabase
                        .from('registrasi_instansi')
                        .update({ status_prospek: newStatus })
                        .eq('id', leadId);

                    if (error) throw error;
                    
                    // Catat aktivitas ke tabel audit log sistem
                    await supabase.from('system_logs').insert([{ 
                        type: 'info', 
                        message: `Status prospek ID ${leadId} berhasil diubah menjadi ${newStatus}` 
                    }]);

                    loadLeadsData(); // Refresh data biar counter ikut berubah

                } catch (err) {
                    alert("Gagal merubah status: " + err.message);
                }
            }
        });

        document.body.addEventListener('click', async (e) => {
            // B. LOGIKA HUBUNGI VIA WHATSAPP
            const chatBtn = e.target.closest('.btn-chat-lead');
            if (chatBtn) {
                const picName = chatBtn.getAttribute('data-name');
                const schoolName = chatBtn.getAttribute('data-school');
                
                // Rakit teks follow up premium untuk calon client
                const textMsg = `Halo Selamat Hari Bapak/Ibu *${picName}* dari *${schoolName}*,\n\nTerima kasih telah mengajukan formulir digitalisasi sekolah di platform *Alima CBT Enterprise*.\n\nSaya dengan Founder Alima CBT ingin mengonfirmasi kelanjutan pendaftaran instansi Anda mengenai paket sistem yang Anda pilih. Apakah ada waktu luang untuk kita berdiskusi via telepon atau demo zoom singkat?\n\nTerima kasih banyak, ditunggu kabar baiknya. 🙏✨`;
                
                // Cari tahu apakah nomor WA tersimpan, jika tidak kirim ke tim CS utama/manual
                window.open(`https://wa.me/6281234567890?text=${encodeURIComponent(textMsg)}`, '_blank');
            }

            // C. LOGIKA HAPUS DATA LEAD
            const deleteBtn = e.target.closest('.btn-delete-lead');
            if (deleteBtn) {
                const leadId = deleteBtn.getAttribute('data-id');
                const name = deleteBtn.getAttribute('data-name');

                if (confirm(`Apakah Bos yakin ingin menghapus data prospek dari [ ${name} ] secara permanen?`)) {
                    try {
                        const { error } = await supabase.from('registrasi_instansi').delete().eq('id', leadId);
                        if (error) throw error;

                        await supabase.from('system_logs').insert([{ 
                            type: 'warn', 
                            message: `Prospek instansi ${name} (ID: ${leadId}) dihapus dari pipeline.` 
                        }]);

                        loadLeadsData(); // Refresh ulang tabel

                    } catch (err) {
                        alert("Gagal menghapus data: " + err.message);
                    }
                }
            }
        });

    </script>
</body>
</html>
