<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Logs | Alima CBT Enterprise</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../../css/global.css">
</head>
<body class="flex h-screen bg-[#030712] overflow-hidden font-sans text-slate-200 selection:bg-indigo-500/30">

    <div id="sidebar-container"></div>

    <main class="flex-1 flex flex-col h-screen overflow-hidden relative z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-indigo-500/5 rounded-full blur-[120px] pointer-events-none"></div>

        <header class="bg-[#0a0f1c]/70 backdrop-blur-xl border-b border-slate-800/50 p-4 md:p-5 flex justify-between items-center z-10 sticky top-0">
           <div class="flex items-center gap-4">
             <button id="open-sidebar" class="lg:hidden text-indigo-500 hover:text-white transition-colors">
                 <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
             </button>
             <h2 class="text-sm md:text-base font-black text-white tracking-widest uppercase flex items-center gap-2">
                 <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-slate-500"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg>
                 Audit Trail
             </h2>
           </div>
           <div class="flex items-center gap-2 bg-indigo-500/10 border border-indigo-500/20 px-3 py-1.5 rounded-lg text-indigo-400 text-[10px] font-black uppercase tracking-widest shadow-sm">
             Tracking Aktif
           </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-8 z-10 custom-scrollbar">
            <div class="max-w-4xl mx-auto animate-in fade-in duration-500">
                
                <div class="mb-10 text-center md:text-left md:flex justify-between items-end">
                    <div>
                        <h3 class="text-2xl font-black text-white tracking-tight">Log Sistem & Keamanan</h3>
                        <p class="text-sm text-slate-400 mt-2 max-w-xl leading-relaxed">Rekaman otomatis seluruh aktivitas krusial, perubahan database, registrasi klien, dan peringatan error pada sistem Master Dashboard.</p>
                    </div>
                </div>

                <div id="logs-container" class="space-y-6 relative before:absolute before:inset-0 before:ml-5 before:-translate-x-px md:before:mx-auto md:before:translate-x-0 before:h-full before:w-0.5 before:bg-gradient-to-b before:from-indigo-500/50 before:via-slate-800 before:to-transparent pb-10">
                    
                    <div class="p-10 text-center text-slate-500 font-bold relative z-10 bg-[#0a0f1c]/50 rounded-2xl backdrop-blur-sm border border-slate-800/50">Memuat rekaman log server...</div>

                </div>

            </div>
        </div>
    </main>

    <script type="module">
        import { supabase } from '../../js/config/supabase.js';
        import { renderSidebar } from '../../js/components/sidebar.js';

        renderSidebar();

        // Proteksi Halaman
        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) window.location.href = '../auth/login.html';
            else document.getElementById('sidebar-user-email').innerText = session.user.email;
        }
        checkAuth();

        // ==========================================
        // 1. FUNGSI TARIK DATA LOGS DARI SUPABASE
        // ==========================================
        async function fetchSystemLogs() {
            const container = document.getElementById('logs-container');
            
            try {
                // Tarik 50 log terbaru, urutkan dari yang paling baru
                const { data: logs, error } = await supabase
                    .from('system_logs')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(50);

                if (error) throw error;

                if (!logs || logs.length === 0) {
                    container.innerHTML = `
                    <div class="p-16 text-center text-slate-500 font-bold relative z-10 bg-[#0a0f1c]/50 rounded-3xl backdrop-blur-sm border-2 border-dashed border-slate-800 flex flex-col items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="mb-4 text-slate-600"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                        Belum ada aktivitas terekam di sistem.
                    </div>`;
                    return;
                }

                renderLogsUI(logs);

            } catch (err) {
                console.error("Gagal memuat log:", err.message);
                container.innerHTML = `<div class="p-6 text-center text-rose-500 font-bold relative z-10">Gagal terhubung ke database log: ${err.message}</div>`;
            }
        }

        // ==========================================
        // 2. FUNGSI RENDER UI TIMELINE (GARIS WAKTU)
        // ==========================================
        function renderLogsUI(logs) {
            const container = document.getElementById('logs-container');
            let htmlLogs = '';

            logs.forEach(log => {
                // Parsing Tanggal & Waktu
                const dateObj = new Date(log.created_at);
                const timeStr = `${String(dateObj.getHours()).padStart(2,'0')}:${String(dateObj.getMinutes()).padStart(2,'0')}`;
                const dateStr = dateObj.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });

                // Menentukan Warna, Ikon, dan Desain berdasarkan Tipe Log
                let iconSVG = '';
                let colorClass = '';
                let borderClass = '';
                
                if (log.type === 'info') {
                    colorClass = 'bg-blue-500 text-white shadow-blue-500/30';
                    borderClass = 'hover:border-blue-500/50';
                    iconSVG = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`;
                } else if (log.type === 'success') {
                    colorClass = 'bg-emerald-500 text-white shadow-emerald-500/30';
                    borderClass = 'hover:border-emerald-500/50';
                    iconSVG = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`;
                } else if (log.type === 'warn') {
                    colorClass = 'bg-amber-500 text-black shadow-amber-500/30';
                    borderClass = 'hover:border-amber-500/50';
                    iconSVG = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"></polygon><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`;
                } else if (log.type === 'error') {
                    colorClass = 'bg-rose-500 text-white shadow-rose-500/30';
                    borderClass = 'hover:border-rose-500/50';
                    iconSVG = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`;
                } else {
                    // Fallback Default
                    colorClass = 'bg-slate-700 text-white shadow-slate-700/30';
                    borderClass = 'hover:border-slate-500/50';
                    iconSVG = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>`;
                }

                htmlLogs += `
                <div class="relative flex items-center justify-between md:justify-normal md:odd:flex-row-reverse group transition-all duration-300">
                     <div class="flex items-center justify-center w-10 h-10 rounded-full border-4 border-[#030712] shrink-0 md:order-1 md:group-odd:-translate-x-1/2 md:group-even:translate-x-1/2 shadow-lg z-10 ${colorClass} transition-transform group-hover:scale-110">
                        ${iconSVG}
                     </div>
                     
                     <div class="w-[calc(100%-3.5rem)] md:w-[calc(50%-2.5rem)] bg-[#0a0f1c] border border-slate-800/80 p-5 rounded-2xl shadow-xl transition-all duration-300 ${borderClass}">
                        <div class="flex items-center justify-between space-x-2 mb-2">
                           <div class="font-black text-slate-400 text-[9px] tracking-widest uppercase bg-[#030712] px-2 py-1 rounded border border-slate-800">${log.type}</div>
                           <time class="font-mono text-[10px] font-bold text-slate-500 flex items-center gap-1.5">
                               ${dateStr} <span class="bg-indigo-500/10 text-indigo-400 px-1.5 py-0.5 rounded border border-indigo-500/20">${timeStr} WIB</span>
                           </time>
                        </div>
                        <div class="text-slate-300 text-xs md:text-sm font-semibold leading-relaxed">${log.message}</div>
                     </div>
                </div>
                `;
            });

            container.innerHTML = htmlLogs;
        }

        setTimeout(fetchSystemLogs, 200);

        // ==========================================
        // 3. EVENT LISTENER REAL-TIME (AUTO REFRESH)
        // ==========================================
        // Begitu ada log baru tersimpan, halaman ini akan otomatis memuat ulang timeline tanpa refresh browser.
        supabase
            .channel('audit_trail_changes')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'system_logs' }, (payload) => {
                console.log('Log baru terdeteksi:', payload.new);
                fetchSystemLogs();
            })
            .subscribe();

    </script>
</body>
</html>
