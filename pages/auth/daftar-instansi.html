<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kemitraan Instansi | Alima CBT Enterprise</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../../css/global.css">
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen py-12 px-4 relative antialiased overflow-x-hidden">

    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] right-[-10%] w-[300px] md:w-[600px] h-[300px] md:h-[600px] rounded-full bg-blue-600/10 blur-[80px] md:blur-[120px]"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-[300px] md:w-[600px] h-[300px] md:h-[600px] rounded-full bg-emerald-500/10 blur-[80px] md:blur-[120px]"></div>
    </div>
    
    <div class="watermark-overlay fixed inset-0 pointer-events-none"></div>

    <div class="w-full max-w-lg md:max-w-3xl bg-white/95 backdrop-blur-xl rounded-[2rem] md:rounded-[2.5rem] shadow-2xl border border-white p-6 md:p-12 relative z-10 my-auto transition-all">
        
        <div class="text-center mb-8 md:mb-10">
            <div class="inline-flex p-3 md:p-4 bg-blue-50 text-blue-600 rounded-2xl mb-4 border border-blue-100 shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6 md:w-8 md:h-8"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><polyline points="17 11 19 13 23 9"></polyline></svg>
            </div>
            <h2 class="text-2xl md:text-3xl font-black text-slate-800 tracking-tight">Ajukan Digitalisasi Sekolah</h2>
            <p class="text-xs md:text-sm font-medium text-slate-500 mt-2 leading-relaxed max-w-xl mx-auto">Lengkapi formulir kemitraan. Data Anda akan terenkripsi ke sistem dan terhubung ke WhatsApp Official.</p>
        </div>

        <form id="form-kemitraan" class="space-y-5 md:space-y-6">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 md:gap-6">
                
                <div>
                    <label class="block text-[10px] md:text-xs font-black text-slate-400 uppercase tracking-widest mb-1.5 md:mb-2 ml-1">Nama Lengkap PIC</label>
                    <input type="text" id="cust-name" required placeholder="Cth: Dr. Ahmad Mansur, M.Pd" class="w-full px-4 py-3.5 md:py-4 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-800 outline-none focus:border-blue-500 focus:bg-white transition-all shadow-inner placeholder-slate-400">
                </div>

                <div>
                    <label class="block text-[10px] md:text-xs font-black text-slate-400 uppercase tracking-widest mb-1.5 md:mb-2 ml-1">Jabatan Resmi</label>
                    <input type="text" id="cust-role" required placeholder="Cth: Kepala Sekolah" class="w-full px-4 py-3.5 md:py-4 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-800 outline-none focus:border-blue-500 focus:bg-white transition-all shadow-inner placeholder-slate-400">
                </div>

                <div>
                    <label class="block text-[10px] md:text-xs font-black text-slate-400 uppercase tracking-widest mb-1.5 md:mb-2 ml-1">Nama Sekolah (SMP/SMA/SMK)</label>
                    <input type="text" id="cust-school" required placeholder="Cth: SMP IT Bina Bangsa" class="w-full px-4 py-3.5 md:py-4 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-800 outline-none focus:border-blue-500 focus:bg-white transition-all shadow-inner placeholder-slate-400">
                </div>

                <div>
                    <label class="block text-[10px] md:text-xs font-black text-slate-400 uppercase tracking-widest mb-1.5 md:mb-2 ml-1">Pilihan Paket Investasi</label>
                    <select id="cust-package" required class="w-full px-4 py-3.5 md:py-4 bg-slate-50 border border-slate-200 rounded-xl text-sm font-black text-slate-700 outline-none focus:border-blue-500 focus:bg-white transition-all shadow-inner appearance-none cursor-pointer">
                        <option value="Paket LITE (Rp 1,5 Juta/Thn)">Paket LITE — Rp 1,5 Juta / Thn</option>
                        <option value="Paket PREMIUM (Rp 3,5 Juta/Thn)" selected>Paket PREMIUM — Rp 3,5 Juta / Thn</option>
                        <option value="Paket ENTERPRISE (Custom)">Paket ENTERPRISE — Kustom</option>
                    </select>
                </div>

            </div>

            <div>
                <label class="block text-[10px] md:text-xs font-black text-slate-400 uppercase tracking-widest mb-1.5 md:mb-2 ml-1">Catatan Kebutuhan (Opsional)</label>
                <textarea id="cust-message" rows="3" placeholder="Cth: Butuh kapasitas ujian simultan untuk 300 siswa..." class="w-full px-4 py-3.5 md:py-4 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 outline-none focus:border-blue-500 focus:bg-white transition-all shadow-inner placeholder-slate-400 resize-none"></textarea>
            </div>

            <button type="submit" id="btn-submit-customer" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-xl text-sm md:text-base font-bold shadow-lg shadow-blue-600/30 active:scale-95 transition-all tracking-wide mt-6 flex justify-center items-center gap-2.5">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><path d="M22 2L11 13"></path><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                <span>KIRIM KE WHATSAPP</span>
            </button>

            
            <div class="text-center pt-5 border-t border-slate-100 mt-6">
                <a href="../../index.html" class="inline-flex items-center gap-2 text-[11px] md:text-xs font-bold text-slate-400 hover:text-slate-600 transition-colors uppercase tracking-wider p-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    Kembali ke Beranda
                </a>
            </div>
        </form>
    </div>

    <script type="module" src="../../js/pages/daftar-instansi.js"></script>
</body>
</html>
