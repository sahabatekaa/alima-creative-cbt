<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hasil Akhir | Alima CBT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; } /* Tema Gelap Elegan */
        
        /* Efek Kaca (Glassmorphism) */
        .glass-card { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        
        /* Animasi Muncul dari Bawah */
        @keyframes slideUpFade { 
            from { opacity: 0; transform: translateY(40px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .animate-slide-up { animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-5 overflow-hidden relative">
    
    <div class="absolute top-[-10%] left-[-10%] w-80 h-80 bg-emerald-500 rounded-full mix-blend-screen filter blur-[100px] opacity-30 animate-pulse"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-80 h-80 bg-blue-500 rounded-full mix-blend-screen filter blur-[100px] opacity-30 animate-pulse" style="animation-delay: 2s;"></div>

    <div class="glass-card rounded-[2.5rem] p-8 md:p-10 max-w-sm w-full text-center relative z-10 shadow-2xl opacity-0 animate-slide-up">
        
        <div class="w-20 h-20 md:w-24 md:h-24 bg-gradient-to-tr from-emerald-400 to-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-[0_0_30px_rgba(52,211,153,0.4)] transform hover:scale-110 transition-transform duration-500">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" class="md:w-[48px] md:h-[48px]"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        </div>
        
        <h1 class="text-2xl md:text-3xl font-black text-white mb-1 tracking-wide">UJIAN SELESAI!</h1>
        <p class="text-slate-400 font-bold mb-8 text-xs md:text-sm" id="student-info">Terima kasih telah mengerjakan dengan jujur.</p>

        <div class="bg-white/5 rounded-[2rem] p-6 mb-8 border border-white/10 relative overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-b from-white/5 to-transparent pointer-events-none"></div>
            <p class="text-slate-400 text-[10px] font-black uppercase tracking-[0.2em] mb-1">Nilai Akhir Anda</p>
            <div class="text-6xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-300 to-blue-400 drop-shadow-2xl" id="score-display">0</div>
        </div>

        <button onclick="keluar()" class="w-full bg-white text-slate-900 hover:bg-slate-200 py-4 rounded-2xl font-black tracking-widest active:scale-95 transition-all shadow-xl text-sm md:text-base">
            KEMBALI KE PORTAL
        </button>
    </div>

    <script>
        // 1. MESIN LEDAKAN CONFETTI
        function tembakKembangApi() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) { return Math.random() * (max - min) + min; }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);
                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        // 2. AMBIL DATA DAN JALANKAN ANIMASI ANGKA
        document.addEventListener('DOMContentLoaded', () => {
            tembakKembangApi(); // Dor kembang api!

            const urlParams = new URLSearchParams(window.location.search);
            let targetScore = parseInt(urlParams.get('score')) || 0;
            
            // Animasi Angka Berjalan (Count Up)
            let count = 0;
            const display = document.getElementById('score-display');
            const speed = targetScore > 0 ? Math.ceil(targetScore / 30) : 1; 
            
            const counter = setInterval(() => {
                if (targetScore === 0) { clearInterval(counter); return; }
                count += speed;
                if(count >= targetScore) { count = targetScore; clearInterval(counter); }
                display.innerText = count;
            }, 40);

            // Tampilkan Nama & Mapel Siswa
            const sData = JSON.parse(localStorage.getItem('studentData_backup'));
            if(sData) {
                document.getElementById('student-info').innerText = `${sData.name.toUpperCase()} • MAPEL: ${sData.mapel.toUpperCase()}`;
            }
        });

        // 3. FUNGSI KELUAR
        function keluar() {
            localStorage.clear(); // Bersihkan sisa-sisa kotoran ujian
            window.location.href = 'portal.html';
        }
    </script>
</body>
</html>
