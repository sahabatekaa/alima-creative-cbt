<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pengawas | Alima CBT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../../css/global.css">
    <style>@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap'); body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="flex h-screen bg-[#F8FAFC] overflow-hidden font-sans text-slate-800 w-full max-w-[100vw]">
    <div id="sidebar-container"></div>
    <main class="flex-1 flex flex-col h-screen overflow-hidden relative z-0 w-full">
        <header class="bg-white border-b border-slate-200 p-4 md:px-6 lg:px-8 flex justify-between items-center z-10 sticky top-0 shadow-sm w-full gap-4">
           <div class="flex items-center gap-3 flex-1 overflow-hidden pr-2">
             <button id="open-sidebar" onclick="document.getElementById('pengawas-sidebar')?.classList.toggle('-translate-x-full'); document.getElementById('sidebar-overlay')?.classList.toggle('hidden');" class="md:hidden p-2 bg-slate-100 rounded-lg text-indigo-600 hover:bg-slate-200 transition-colors shrink-0">
                 <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
             </button>
             <h2 class="text-[11px] md:text-xs lg:text-sm font-black text-slate-800 uppercase tracking-widest line-clamp-2 leading-snug break-words" id="topbar-school-name">Portal Pengawas V3</h2>
           </div>
           <div class="flex items-center gap-3 shrink-0">
               <div class="text-right hidden md:block ml-2">
                   <p class="text-xs font-bold text-slate-800 truncate max-w-[120px]" id="user-name">Memuat...</p>
                   <p class="text-[9px] font-black text-indigo-600 uppercase tracking-widest">Pengawas Ruang</p>
               </div>
               <div class="w-9 h-9 md:w-10 md:h-10 rounded-full bg-indigo-100 border border-indigo-200 flex items-center justify-center text-indigo-700 font-black shrink-0" id="user-initial">P</div>
           </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 custom-scrollbar w-full">
            <div class="max-w-6xl mx-auto space-y-6 animate-in fade-in duration-500 pb-10">
               <div class="bg-indigo-600 rounded-[24px] p-6 md:p-10 text-white shadow-xl shadow-indigo-600/20 relative overflow-hidden">
                  <div class="absolute right-0 top-0 opacity-10 transform translate-x-10 -translate-y-5 pointer-events-none"><svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg></div>
                  <div class="relative z-10">
                      <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-white/20 border border-white/30 text-white text-[10px] font-black uppercase tracking-widest mb-4 backdrop-blur-sm shadow-sm">Pusat Monitor Ujian</div>
                      <h2 class="text-3xl md:text-4xl lg:text-5xl font-black text-white mb-3 tracking-tight leading-tight">Selamat Datang, <br class="md:hidden"/><span id="welcome-name">Pengawas</span>!</h2>
                      <p class="text-indigo-100 font-medium text-sm md:text-base max-w-2xl leading-relaxed">Pantau seluruh ruangan ujian yang sedang aktif di instansi ini. Segera tindaklanjuti pelanggaran dari menu Radar Sesi.</p>
                  </div>
               </div>

               <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 md:gap-5">
                  <div class="bg-white p-5 md:p-6 rounded-[20px] border border-slate-200 shadow-sm flex flex-col justify-between hover:border-indigo-400 group transition-all">
                     <div class="flex items-center justify-between mb-4"><div class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center group-hover:scale-110 transition-transform"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></div></div>
                     <div><p class="text-[10px] md:text-xs font-black text-slate-400 uppercase tracking-widest mb-1">Total Sesi Aktif Hari Ini</p><h3 class="text-3xl md:text-4xl font-black text-slate-800" id="stat-sesi">0</h3></div>
                  </div>
                  <div class="bg-white p-5 md:p-6 rounded-[20px] border border-slate-200 shadow-sm flex flex-col justify-between hover:border-emerald-400 group transition-all">
                     <div class="flex items-center justify-between mb-4"><div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center group-hover:scale-110 transition-transform"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg></div></div>
                     <div><p class="text-[10px] md:text-xs font-black text-slate-400 uppercase tracking-widest mb-1">Seluruh Peserta Live</p><h3 class="text-3xl md:text-4xl font-black text-slate-800" id="stat-live">0</h3></div>
                  </div>
                  <div class="bg-white p-5 md:p-6 rounded-[20px] border border-slate-200 shadow-sm flex flex-col justify-between hover:border-red-400 group transition-all">
                     <div class="flex items-center justify-between mb-4"><div class="w-10 h-10 rounded-xl bg-red-50 text-red-600 flex items-center justify-center group-hover:scale-110 transition-transform"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></div></div>
                     <div><p class="text-[10px] md:text-xs font-black text-slate-400 uppercase tracking-widest mb-1">Pelanggaran / Curang</p><h3 class="text-3xl md:text-4xl font-black text-slate-800" id="stat-curang">0</h3></div>
                  </div>
               </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { supabase } from '../../js/config/supabase.js';
        import { renderPengawasSidebar } from '../../js/components/sidebar-pengawas.js';
        
        setTimeout(() => renderPengawasSidebar(), 100);

        async function initPage() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) return window.location.href = '../auth/login.html';
            const { data: profile } = await supabase.from('users').select('*').eq('id', session.user.id).single();
            if (!profile || profile.role !== 'proctor') return window.location.href = '../auth/login.html';
            
            document.getElementById('user-name').innerText = profile.name;
            document.getElementById('welcome-name').innerText = profile.name.split(' ')[0];
            document.getElementById('user-initial').innerText = profile.name.charAt(0).toUpperCase();

            // [INJEKSI 1] - FILTER STATISTIK HARI INI
            const hariIniISO = new Date().toISOString().slice(0, 10);

            // AMBIL SELURUH SESI DI SEKOLAH TERSEBUT YANG JADWALNYA HARI INI
            const { data: sesi, count: cSesi } = await supabase.from('exam_sessions')
                .select('token', {count:'exact'})
                .eq('school_id', profile.school_id)
                .eq('status', 'open')
                .eq('tanggal', hariIniISO); // Menyingkirkan sesi seminggu lalu
            
            document.getElementById('stat-sesi').innerText = cSesi || 0;

            if(sesi && sesi.length > 0) {
                const tokens = sesi.map(s => s.token);
                const { data: live } = await supabase.from('live_students').select('status, warnings').in('token', tokens);
                if(live) {
                    document.getElementById('stat-live').innerText = live.filter(l => l.status !== 'Selesai').length;
                    document.getElementById('stat-curang').innerText = live.filter(l => l.warnings > 0).length;
                }
            }
        }
        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
