<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pusat Komando Jadwal | Alima CBT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../../css/global.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="flex h-screen bg-[#F8FAFC] overflow-hidden font-sans text-slate-800 w-full max-w-[100vw]">

    <div id="sidebar-container"></div>

    <main class="flex-1 flex flex-col h-screen overflow-hidden relative z-0 w-full">
        
        <header class="bg-white border-b border-slate-200 p-4 md:px-6 lg:px-8 flex justify-between items-center z-10 sticky top-0 shadow-sm w-full gap-4">
           <div class="flex items-center gap-3 flex-1 overflow-hidden pr-2">
             <button id="open-sidebar" class="md:hidden p-2 bg-slate-100 rounded-lg text-blue-600 hover:bg-slate-200 transition-colors shrink-0">
                 <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
             </button>
             <h2 class="text-[11px] md:text-xs lg:text-sm font-black text-slate-800 uppercase tracking-widest line-clamp-2 leading-snug break-words" id="topbar-school-name">Memuat Data Instansi...</h2>
           </div>
           
           <div class="flex items-center gap-3 shrink-0">
               <div class="text-right hidden md:block ml-2">
                   <p class="text-xs font-bold text-slate-800 truncate max-w-[120px]" id="user-name">Memuat...</p>
                   <p class="text-[9px] font-black text-blue-600 uppercase tracking-widest">Tata Usaha</p>
               </div>
               <div class="w-9 h-9 md:w-10 md:h-10 rounded-full bg-blue-100 border border-blue-200 flex items-center justify-center text-blue-700 font-black shrink-0" id="user-initial">TU</div>
           </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 custom-scrollbar w-full">
            <div class="max-w-6xl mx-auto space-y-6 pb-10 animate-in fade-in duration-300">
                
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-6 rounded-[24px] shadow-sm border border-slate-200">
                    <div>
                        <h3 class="text-xl font-black text-slate-800 flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-blue-600"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                            Pusat Plotting Jadwal
                        </h3>
                        <p class="text-xs font-bold text-slate-400 mt-1">Tarik token dari guru dan tentukan Tanggal serta Waktu pelaksanaannya.</p>
                    </div>
                    <button id="btn-open-sesi" class="w-full md:w-auto bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-xl text-xs font-black flex items-center justify-center gap-2 transition-all shadow-md shadow-blue-600/10 active:scale-95">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg> Plot Jadwal Baru
                    </button>
                </div>

                <div class="bg-white rounded-[24px] border border-slate-200 overflow-hidden shadow-sm w-full">
                    <div class="overflow-x-auto w-full custom-scrollbar">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="bg-slate-50 text-slate-500 border-b border-slate-200">
                                <tr>
                                    <th class="py-4 px-5 font-black uppercase text-[10px] tracking-wider">Mata Pelajaran & Pengawas</th>
                                    <th class="py-4 px-5 font-black uppercase text-[10px] tracking-wider text-center">Kelas/Ruang</th>
                                    <th class="py-4 px-5 font-black uppercase text-[10px] tracking-wider text-center">Token Ujian</th>
                                    <th class="py-4 px-5 font-black uppercase text-[10px] tracking-wider text-center">Jadwal Pelaksanaan</th>
                                    <th class="py-4 px-5 text-center font-black uppercase text-[10px] tracking-wider">Status</th>
                                    <th class="py-4 px-5 text-center font-black uppercase text-[10px] tracking-wider w-24">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="sesi-table-body" class="divide-y divide-slate-100">
                                <tr><td colspan="6" class="p-10 text-center text-slate-400 font-bold">Memuat jadwal...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <div id="modal-sesi" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white p-6 rounded-[24px] w-full max-w-md border border-slate-200 shadow-2xl animate-in zoom-in-95 duration-200">
             <h2 class="text-lg font-black mb-5 text-slate-800 flex items-center gap-2">
                 <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-blue-600"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                 Plotting Waktu Sesi
             </h2>
             <form id="form-sesi" class="space-y-4">
                 
                 <div class="bg-blue-50/50 p-3 rounded-xl border border-blue-100">
                     <label class="text-[10px] font-black text-blue-800 uppercase tracking-widest block mb-1.5 pl-0.5">Tarik Sesi Guru</label>
                     <select id="j_token_select" required class="w-full p-3 bg-white border border-blue-200 rounded-xl text-xs font-bold text-slate-800 outline-none focus:border-blue-500 cursor-pointer shadow-sm">
                         <option value="">-- Sedang mencari sesi guru... --</option>
                     </select>
                 </div>
                 
                 <div>
                     <label class="text-[10px] font-black text-slate-500 uppercase mb-1 block pl-0.5">Tanggal Pelaksanaan</label>
                     <input type="date" id="j_tanggal" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-700 outline-none focus:border-blue-500 cursor-pointer">
                 </div>

                 <div class="grid grid-cols-2 gap-4">
                     <div>
                         <label class="text-[10px] font-black text-slate-500 uppercase mb-1 block pl-0.5">Jam Mulai</label>
                         <input type="time" id="j_mulai" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-700 outline-none focus:border-blue-500">
                     </div>
                     <div>
                         <label class="text-[10px] font-black text-slate-500 uppercase mb-1 block pl-0.5">Jam Selesai</label>
                         <input type="time" id="j_selesai" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-700 outline-none focus:border-blue-500">
                     </div>
                 </div>
                 
                 <div class="flex gap-3 mt-6 pt-2 border-t border-slate-100">
                     <button type="button" id="btn-close-sesi" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-bold transition-all">Batal</button>
                     <button type="submit" class="flex-1 py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-sm font-black transition-all shadow-md">Simpan Jadwal</button>
                 </div>
             </form>
        </div>
    </div>

    <script type="module">
        import { supabase } from '../../js/config/supabase.js';
        import { renderAdminSidebar } from '../../js/components/sidebar-admin.js';

        renderAdminSidebar();
        let schoolId = null;
        let sesiMentah = []; // Tempat menyimpan sesi dari guru yang belum diplot

        async function initPage() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) return window.location.href = '../auth/login.html';
            
            const { data: profile } = await supabase.from('users').select('*').eq('id', session.user.id).single();
            schoolId = profile.school_id;
            
            document.getElementById('user-name').innerText = profile.name;
            document.getElementById('user-initial').innerText = profile.name.charAt(0).toUpperCase();
            
            const { data: school } = await supabase.from('schools').select('name').eq('id', schoolId).single();
            document.getElementById('topbar-school-name').innerText = school ? school.name : schoolId.toUpperCase();
            
            document.getElementById('j_tanggal').value = new Date().toISOString().slice(0, 10);
            
            loadDropdownSesiMentah();
            loadSessions();
        }

        // FUNGSI BARU: Menarik sesi guru yang belum punya jadwal
        async function loadDropdownSesiMentah() {
            const select = document.getElementById('j_token_select');
            const { data } = await supabase.from('exam_sessions')
                .select('*')
                .eq('school_id', schoolId)
                .order('created_at', { ascending: false });

            if(!data) return select.innerHTML = '<option value="">Gagal memuat data</option>';

            // Simpan semua data untuk kebutuhan fitur EDIT
            sesiMentah = data;

            // Untuk form TAMBAH BARU, hanya tampilkan yang TANGGAL-nya kosong
            const waiting = data.filter(s => !s.tanggal || s.tanggal.trim() === '');
            
            if(waiting.length === 0) {
                select.innerHTML = '<option value="">✅ Semua Sesi Sudah Terjadwal</option>';
            } else {
                select.innerHTML = '<option value="">-- Pilih Sesi (Token) --</option>' + 
                    waiting.map(s => `<option value="${s.token}">[${s.token}] Kls ${s.kelas} - ${s.mapel}</option>`).join('');
            }
        }

        async function loadSessions() {
            const tbody = document.getElementById('sesi-table-body');
            try {
                const { data: sessions, error } = await supabase.from('exam_sessions').select('*').eq('school_id', schoolId).order('tanggal', { ascending: false }).order('jam_mulai', { ascending: true });
                if(error) throw error;

                if(!sessions || sessions.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="p-10 text-center text-slate-400 font-bold border-2 border-dashed border-slate-100 m-4 rounded-2xl">Belum ada sesi ujian.</td></tr>';
                    return;
                }

                tbody.innerHTML = sessions.map(s => {
                    const hasSchedule = s.tanggal && s.tanggal.trim() !== '';
                    const isToday = hasSchedule && s.tanggal === new Date().toISOString().slice(0, 10);
                    const tglFormat = hasSchedule ? new Date(s.tanggal).toLocaleDateString('id-ID', {day:'numeric', month:'short', year:'numeric'}) : '-';
                    
                    return `
                    <tr class="hover:bg-slate-50/80 transition-colors border-b border-slate-100 ${!hasSchedule ? 'bg-amber-50/20' : ''}">
                        <td class="py-3 px-5">
                            <p class="font-black text-slate-800 text-sm uppercase">${s.mapel || '-'}</p>
                            <p class="text-[10px] text-slate-500 font-medium font-mono">${s.teacher_email || '-'}</p>
                        </td>
                        <td class="py-3 px-5 text-center font-bold text-slate-600 text-xs">Kls ${s.kelas}-${s.sub_kelas||''}</td>
                        <td class="py-3 px-5 text-center"><span class="font-mono font-black text-blue-600 bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-100 tracking-widest">${s.token}</span></td>
                        
                        <td class="py-3 px-5 text-center">
                            ${hasSchedule ? `
                                <p class="font-black text-xs ${isToday ? 'text-blue-600' : 'text-slate-500'}">${isToday ? '🔥 HARI INI' : tglFormat}</p>
                                <p class="font-bold text-slate-400 text-[10px]">${s.jam_mulai} <span class="mx-1">s/d</span> ${s.jam_selesai}</p>
                            ` : `
                                <span class="bg-amber-100 text-amber-700 text-[9px] font-black px-2 py-1 rounded animate-pulse">BELUM DIATUR</span>
                            `}
                        </td>

                        <td class="py-3 px-5 text-center">
                            <span class="text-[9px] font-black uppercase px-2 py-1.5 rounded border ${!hasSchedule ? 'bg-amber-50 text-amber-600 border-amber-200' : (s.status === 'open' ? 'bg-emerald-50 text-emerald-600 border-emerald-200' : 'bg-slate-100 text-slate-400 border-slate-200')}">
                                ${!hasSchedule ? '⏳ Menunggu Jadwal' : (s.status === 'open' ? '🔴 Terjadwal' : 'Selesai')}
                            </span>
                        </td>
                        <td class="py-3 px-5 text-center">
                            <button onclick="bukaModalEdit('${s.token}')" class="text-slate-400 hover:text-blue-600 p-2 rounded-lg transition-colors border border-slate-200 bg-slate-50 hover:bg-blue-50 shadow-sm" title="${!hasSchedule ? 'Plot Jadwal Sekarang' : 'Edit Jadwal'}">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                            </button>
                            ${hasSchedule ? `
                            <button onclick="toggleSession('${s.id}', '${s.status}')" class="text-slate-400 hover:text-rose-600 p-2 rounded-lg transition-colors border border-slate-200 bg-slate-50 hover:bg-rose-50 shadow-sm" title="${s.status === 'open' ? 'Tutup Paksa Ujian' : 'Buka Kembali Ujian'}">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                            </button>
                            ` : ''}
                        </td>
                    </tr>
                    `
                }).join('');
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-10 text-center text-red-500 font-bold border-2 border-dashed border-red-200 m-4 rounded-2xl">Gagal memuat: ${err.message}</td></tr>`;
            }
        }

        const modal = document.getElementById('modal-sesi');
        
        document.getElementById('btn-open-sesi').onclick = () => {
            document.getElementById('form-sesi').reset();
            document.getElementById('j_tanggal').value = new Date().toISOString().slice(0, 10);
            document.getElementById('j_token_select').disabled = false;
            loadDropdownSesiMentah(); // Refresh dropdown
            modal.classList.replace('hidden', 'flex');
        };
        
        document.getElementById('btn-close-sesi').onclick = () => modal.classList.replace('flex', 'hidden');

        // Fungsi Edit: Mengisi form dari data sesi yang diklik (walau sudah ada jadwalnya)
        window.bukaModalEdit = (token) => {
            const sesi = sesiMentah.find(s => s.token === token);
            if(!sesi) return;

            // Masukkan token ini ke dropdown (kalau sebelumnya tidak ada karena disembunyikan filter waiting)
            const select = document.getElementById('j_token_select');
            let optionExists = Array.from(select.options).some(opt => opt.value === token);
            if (!optionExists) {
                const opt = document.createElement('option');
                opt.value = token;
                opt.text = `[${token}] Kls ${sesi.kelas} - ${sesi.mapel}`;
                select.add(opt);
            }

            select.value = token;
            select.disabled = true; // Kunci dropdown agar tidak salah edit sesi lain
            
            document.getElementById('j_tanggal').value = sesi.tanggal || new Date().toISOString().slice(0, 10);
            document.getElementById('j_mulai').value = sesi.jam_mulai || '07:00';
            document.getElementById('j_selesai').value = sesi.jam_selesai || '09:00';
            
            modal.classList.replace('hidden', 'flex');
        };

        // Form Submit: KITA HANYA MENG-UPDATE KOLOM TANGGAL & JAM SAJA
        document.getElementById('form-sesi').onsubmit = async (e) => {
            e.preventDefault();
            const token = document.getElementById('j_token_select').value;
            if(!token) return alert("Pilih token sesi terlebih dahulu!");

            // Kalkulasi Durasi
            const jamMulai = document.getElementById('j_mulai').value;
            const jamSelesai = document.getElementById('j_selesai').value;
            const [h1, m1] = jamMulai.split(':').map(Number);
            const [h2, m2] = jamSelesai.split(':').map(Number);
            let kalkulasiDurasi = (h2 * 60 + m2) - (h1 * 60 + m1);
            if(kalkulasiDurasi <= 0) kalkulasiDurasi = 120; 

            const { error } = await supabase.from('exam_sessions')
                .update({
                    tanggal: document.getElementById('j_tanggal').value,
                    jam_mulai: jamMulai,
                    jam_selesai: jamSelesai,
                    durasi: kalkulasiDurasi,
                    status: 'open' // Aktifkan langsung saat diplot
                })
                .eq('token', token);

            if(!error) { 
                modal.classList.replace('flex', 'hidden'); 
                loadSessions(); 
                loadDropdownSesiMentah(); // Refresh stok sesi yang belum diplot
            } else {
                alert("Gagal menyimpan jadwal: " + error.message);
            }
        };

        window.toggleSession = async (id, currentStatus) => {
            const newStatus = currentStatus === 'open' ? 'closed' : 'open';
            if(confirm(`Ubah status akses ujian menjadi ${newStatus.toUpperCase()}?`)) {
                await supabase.from('exam_sessions').update({status: newStatus}).eq('id', id); loadSessions();
            }
        };

        // Admin TU tetap bisa hapus jadwal jika memang guru salah bikin
        window.delSession = async (id) => {
            if(confirm("Hapus jadwal ujian ini secara permanen?")) {
                await supabase.from('exam_sessions').delete().eq('id', id); loadSessions();
                loadDropdownSesiMentah();
            }
        };

        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
