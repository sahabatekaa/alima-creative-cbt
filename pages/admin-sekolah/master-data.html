<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Data Sekolah | Alima CBT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../../css/global.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="flex h-screen bg-[#F8FAFC] overflow-hidden font-sans text-slate-800 w-full max-w-[100vw]">

    <div id="sidebar-container"></div>

    <main class="flex-1 flex flex-col h-screen overflow-hidden relative z-0 w-full">
        
        <header class="bg-white border-b border-slate-200 p-4 md:px-6 lg:px-8 flex justify-between items-center z-10 sticky top-0 shadow-sm w-full gap-4">
           <div class="flex items-center gap-3 flex-1 overflow-hidden pr-2">
             <button id="open-sidebar" class="md:hidden p-2 bg-slate-100 rounded-lg text-blue-600 hover:bg-slate-200 transition-colors shrink-0">
                 <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
             </button>
             <h2 class="text-[11px] md:text-xs lg:text-sm font-black text-slate-800 uppercase tracking-widest line-clamp-2 leading-snug break-words" id="topbar-school-name">Memuat Data Instansi...</h2>
           </div>
           
           <div class="flex items-center gap-3 shrink-0">
               <div class="text-right hidden md:block ml-2">
                   <p class="text-xs font-bold text-slate-800 truncate max-w-[120px]" id="user-name">Memuat...</p>
                   <p class="text-[9px] font-black text-blue-600 uppercase tracking-widest">Tata Usaha</p>
               </div>
               <div class="w-9 h-9 md:w-10 md:h-10 rounded-full bg-blue-100 border border-blue-200 flex items-center justify-center text-blue-700 font-black shrink-0" id="user-initial">TU</div>
           </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 custom-scrollbar w-full">
            <div class="max-w-5xl mx-auto space-y-6 pb-10 animate-in fade-in duration-300">
                
                <div class="bg-white p-6 rounded-[24px] shadow-sm border border-slate-200 mb-6">
                    <h3 class="text-xl font-black text-slate-800 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-blue-600"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                        Manajemen Master Data
                    </h3>
                    <p class="text-xs font-bold text-slate-400 mt-1">Daftarkan Kelas dan Mata Pelajaran resmi instansi Anda.</p>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-white rounded-[24px] border border-slate-200 shadow-sm overflow-hidden flex flex-col h-[500px]">
                        <div class="p-5 border-b border-slate-100 bg-slate-50">
                            <h4 class="font-black text-slate-800 text-base flex items-center gap-2"><span class="text-amber-500">🏫</span> Kelas / Rombel</h4>
                        </div>
                        <div class="p-5 flex-1 overflow-y-auto custom-scrollbar">
                            <ul id="list-kelas" class="space-y-2"></ul>
                        </div>
                        <div class="p-4 border-t border-slate-100 bg-white">
                            <form id="form-kelas" class="flex gap-2">
                                <input type="text" id="in-kelas" placeholder="Cth: 10-A" class="flex-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold uppercase outline-none focus:border-blue-500" required>
                                <button type="submit" class="bg-amber-500 hover:bg-amber-600 text-white px-5 rounded-xl font-black transition-colors">+</button>
                            </form>
                        </div>
                    </div>

                    <div class="bg-white rounded-[24px] border border-slate-200 shadow-sm overflow-hidden flex flex-col h-[500px]">
                        <div class="p-5 border-b border-slate-100 bg-slate-50">
                            <h4 class="font-black text-slate-800 text-base flex items-center gap-2"><span class="text-emerald-500">📚</span> Mata Pelajaran</h4>
                        </div>
                        <div class="p-5 flex-1 overflow-y-auto custom-scrollbar">
                            <ul id="list-mapel" class="space-y-2"></ul>
                        </div>
                        <div class="p-4 border-t border-slate-100 bg-white">
                            <form id="form-mapel" class="flex gap-2">
                                <input type="text" id="in-mapel" placeholder="Cth: Matematika" class="flex-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:border-blue-500 uppercase" required>
                                <button type="submit" class="bg-emerald-500 hover:bg-emerald-600 text-white px-5 rounded-xl font-black transition-colors">+</button>
                            </form>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script type="module">
        import { supabase } from '../../js/config/supabase.js';
        import { renderAdminSidebar } from '../../js/components/sidebar-admin.js';

        renderAdminSidebar();
        let schoolId = null;

        async function initPage() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) return window.location.href = '../auth/login.html';
            
            const { data: profile } = await supabase.from('users').select('*').eq('id', session.user.id).single();
            schoolId = profile.school_id;
            
            document.getElementById('user-name').innerText = profile.name;
            document.getElementById('user-initial').innerText = profile.name.charAt(0).toUpperCase();
            
            const { data: school } = await supabase.from('schools').select('name').eq('id', schoolId).single();
            document.getElementById('topbar-school-name').innerText = school ? school.name : schoolId.toUpperCase();
            
            loadData();
        }

        async function loadData() {
            const { data: kelas } = await supabase.from('master_classes').select('id, name').eq('school_id', schoolId).order('name');
            document.getElementById('list-kelas').innerHTML = kelas ? kelas.map(k => `
                <li class="flex justify-between items-center p-3 bg-white rounded-xl border border-slate-200 font-bold text-sm text-slate-700 shadow-sm">
                    ${k.name} <button onclick="delData('master_classes', ${k.id})" class="text-slate-400 hover:text-rose-500 bg-slate-50 hover:bg-rose-50 p-1.5 rounded-lg border border-transparent hover:border-rose-200 transition-all">×</button>
                </li>
            `).join('') : '';

            const { data: mapel } = await supabase.from('master_subjects').select('id, name').eq('school_id', schoolId).order('name');
            document.getElementById('list-mapel').innerHTML = mapel ? mapel.map(m => `
                <li class="flex justify-between items-center p-3 bg-white rounded-xl border border-slate-200 font-bold text-sm text-slate-700 shadow-sm">
                    ${m.name} <button onclick="delData('master_subjects', ${m.id})" class="text-slate-400 hover:text-rose-500 bg-slate-50 hover:bg-rose-50 p-1.5 rounded-lg border border-transparent hover:border-rose-200 transition-all">×</button>
                </li>
            `).join('') : '';
        }

        document.getElementById('form-kelas').onsubmit = async (e) => {
            e.preventDefault();
            await supabase.from('master_classes').insert({ school_id: schoolId, name: document.getElementById('in-kelas').value.toUpperCase() });
            e.target.reset(); loadData();
        };

        document.getElementById('form-mapel').onsubmit = async (e) => {
            e.preventDefault();
            await supabase.from('master_subjects').insert({ school_id: schoolId, name: document.getElementById('in-mapel').value.toUpperCase() });
            e.target.reset(); loadData();
        };

        window.delData = async (table, id) => {
            if(confirm('Hapus item master ini?')) { await supabase.from(table).delete().eq('id', id); loadData(); }
        }

        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
