<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Soal Instansi | Alima CBT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../../css/global.css">
    <style>@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap'); body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="flex h-screen bg-[#F8FAFC] overflow-hidden font-sans text-slate-800 w-full max-w-[100vw]">
    <div id="sidebar-container"></div>
    <main class="flex-1 flex flex-col h-screen overflow-hidden relative z-0 w-full">
        <header class="bg-white border-b border-slate-200 p-4 md:px-6 lg:px-8 flex justify-between items-center z-10 sticky top-0 shadow-sm w-full gap-4">
           <div class="flex items-center gap-3 flex-1 overflow-hidden pr-2">
             <button id="open-sidebar" class="md:hidden p-2 bg-slate-100 rounded-lg text-blue-600 hover:bg-slate-200 transition-colors shrink-0">
                 <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
             </button>
             <h2 class="text-[11px] md:text-xs lg:text-sm font-black text-slate-800 uppercase tracking-widest line-clamp-2 leading-snug break-words" id="topbar-school-name">Memuat Data Instansi...</h2>
           </div>
           <div class="flex items-center gap-3 shrink-0">
               <div class="text-right hidden md:block ml-2">
                   <p class="text-xs font-bold text-slate-800 truncate max-w-[120px]" id="user-name">Memuat...</p>
                   <p class="text-[9px] font-black text-blue-600 uppercase tracking-widest">Tata Usaha</p>
               </div>
               <div class="w-9 h-9 md:w-10 md:h-10 rounded-full bg-blue-100 border border-blue-200 flex items-center justify-center text-blue-700 font-black shrink-0" id="user-initial">TU</div>
           </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 custom-scrollbar w-full">
            <div class="max-w-6xl mx-auto space-y-6 pb-10 animate-in fade-in duration-300">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-6 rounded-[24px] shadow-sm border border-slate-200">
                    <div>
                        <h3 class="text-xl font-black text-slate-800 flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-blue-600"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg> Monitoring Bank Soal</h3>
                        <p class="text-xs font-bold text-slate-400 mt-1">Pantau kesiapan butir soal yang diunggah oleh Guru.</p>
                    </div>
                    <div class="bg-blue-50 text-blue-700 border border-blue-200 px-5 py-2.5 rounded-xl flex items-center gap-2 w-full md:w-auto justify-center">
                        <span class="text-[10px] font-black uppercase tracking-widest">Total Keseluruhan:</span>
                        <span class="text-lg font-black leading-none" id="total-semua-soal">0</span>
                    </div>
                </div>

                <div class="bg-white rounded-[24px] border border-slate-200 overflow-hidden shadow-sm w-full">
                    <div class="overflow-x-auto w-full custom-scrollbar">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="bg-slate-50 text-slate-500 border-b border-slate-200">
                                <tr>
                                    <th class="py-4 px-5 font-black uppercase text-[10px] tracking-wider w-1/2">Mata Pelajaran</th>
                                    <th class="py-4 px-5 font-black uppercase text-[10px] tracking-wider text-center">Jumlah Soal</th>
                                    <th class="py-4 px-5 font-black uppercase text-[10px] tracking-wider text-center">Status</th>
                                </tr>
                            </thead>
                            <tbody id="bank-soal-body" class="divide-y divide-slate-100">
                                <tr><td colspan="3" class="p-10 text-center text-slate-400 font-bold">Memuat pangkalan data soal...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { supabase } from '../../js/config/supabase.js';
        import { renderAdminSidebar } from '../../js/components/sidebar-admin.js';
        renderAdminSidebar();

        let schoolId = null;

        async function initPage() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) return window.location.href = '../auth/login.html';
                
                const { data: profile } = await supabase.from('users').select('*').eq('id', session.user.id).single();
                schoolId = profile.school_id;
                
                document.getElementById('user-name').innerText = profile.name;
                document.getElementById('user-initial').innerText = profile.name.charAt(0).toUpperCase();
                
                const { data: school } = await supabase.from('schools').select('name').eq('id', schoolId).single();
                document.getElementById('topbar-school-name').innerText = school ? school.name : schoolId.toUpperCase();
                
                loadBankData();
            } catch (err) {
                console.error("Init Error:", err);
            }
        }

        async function loadBankData() {
            const tbody = document.getElementById('bank-soal-body');
            try {
                const { data: mapelList, error: errMapel } = await supabase.from('master_subjects').select('name').eq('school_id', schoolId).order('name');
                
                if(errMapel) throw errMapel;

                if(!mapelList || mapelList.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" class="p-10 text-center text-slate-400 font-bold border-2 border-dashed border-slate-100 m-4 rounded-xl">Belum ada Mata Pelajaran. Tambahkan di menu Master Data.</td></tr>';
                    return;
                }

                let totalGlobal = 0;
                let rows = '';

                for (const m of mapelList) {
                    const { count } = await supabase.from('bank_soal').select('*', { count: 'exact', head: true }).eq('school_id', schoolId).eq('mapel', m.name);
                    const safeCount = count || 0;
                    totalGlobal += safeCount;
                    
                    rows += `
                        <tr class="hover:bg-slate-50/80 transition-colors">
                            <td class="py-4 px-5 font-black text-slate-800 uppercase">${m.name}</td>
                            <td class="py-4 px-5 text-center font-black text-blue-600 text-base">${safeCount}</td>
                            <td class="py-4 px-5 text-center">
                                <span class="text-[10px] font-black uppercase px-2.5 py-1 rounded-md border ${safeCount > 0 ? 'text-emerald-600 bg-emerald-50 border-emerald-200' : 'text-slate-400 bg-slate-50 border-slate-200'}">${safeCount > 0 ? 'Tersedia' : 'Kosong'}</span>
                            </td>
                        </tr>
                    `;
                }
                document.getElementById('total-semua-soal').innerText = totalGlobal;
                tbody.innerHTML = rows;
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-10 text-center text-red-500 font-bold border-2 border-dashed border-red-200 m-4 rounded-xl">Gagal memuat data: ${err.message}</td></tr>`;
            }
        }

        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
