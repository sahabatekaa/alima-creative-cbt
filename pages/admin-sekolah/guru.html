<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Staf & Guru | Alima CBT</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../../css/global.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="flex h-screen bg-[#F8FAFC] overflow-hidden font-sans text-slate-800 selection:bg-blue-200 w-full max-w-[100vw]">

    <div id="sidebar-container"></div>

    <main class="flex-1 flex flex-col h-screen overflow-hidden relative z-0 w-full">
        
        <header class="bg-white border-b border-slate-200 p-4 md:px-6 lg:px-8 flex justify-between items-center z-10 sticky top-0 shadow-sm w-full gap-4">
           <div class="flex items-center gap-3 flex-1 overflow-hidden pr-2">
             <button id="open-sidebar" class="md:hidden p-2 bg-slate-100 rounded-lg text-blue-600 hover:bg-slate-200 transition-colors shrink-0">
                 <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
             </button>
             <h2 class="text-[11px] md:text-xs lg:text-sm font-black text-slate-800 uppercase tracking-widest line-clamp-2 leading-snug break-words" id="topbar-school-name">Memuat Data Instansi...</h2>
           </div>
           
           <div class="flex items-center gap-3 shrink-0">
               <div class="text-right hidden md:block ml-2">
                   <p class="text-xs font-bold text-slate-800 truncate max-w-[120px]" id="user-name">Memuat...</p>
                   <p class="text-[9px] font-black text-blue-600 uppercase tracking-widest">Tata Usaha</p>
               </div>
               <div class="w-9 h-9 md:w-10 md:h-10 rounded-full bg-blue-100 border border-blue-200 flex items-center justify-center text-blue-700 font-black shrink-0" id="user-initial">TU</div>
           </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 custom-scrollbar w-full">
            <div class="max-w-6xl mx-auto space-y-6 pb-10 animate-in fade-in duration-500">
                
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-[24px] shadow-sm border border-slate-200">
                   <div>
                      <h3 class="text-xl font-black text-slate-800 flex items-center gap-2">
                          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-blue-600"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                          Manajemen Staf & Pengajar
                      </h3>
                      <p class="text-xs font-bold text-slate-400 mt-1">Kelola akun otorisasi Guru Bidang Studi & Pengawas Ruangan.</p>
                   </div>
                   <button id="btn-open-guru-modal" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-xl text-xs font-black flex items-center justify-center gap-2 transition-all shadow-md shadow-blue-600/10 active:scale-95">
                       <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg> Tambah Akun Staf
                   </button>
                </div>

                <div id="pending-section" class="bg-amber-50/60 rounded-[20px] border border-amber-200 overflow-hidden shadow-sm p-5 space-y-4 hidden">
                    <div class="font-black text-amber-800 text-sm flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                        Menunggu Persetujuan Masuk (<span id="count-pending">0</span>)
                    </div>
                    <div id="pending-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                </div>

                <div class="bg-white rounded-[24px] border border-slate-200 overflow-hidden shadow-sm w-full">
                    <div class="overflow-x-auto w-full custom-scrollbar">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="bg-slate-50 text-slate-500 border-b border-slate-200">
                                <tr>
                                    <th class="py-4 px-5 text-center w-12 font-black uppercase text-[10px] tracking-wider">No</th>
                                    <th class="py-4 px-5 font-black uppercase text-[10px] tracking-wider">Nama Lengkap & Email</th>
                                    <th class="py-4 px-5 font-black uppercase text-[10px] tracking-wider">Hak Akses Jabatan</th>
                                    <th class="py-4 px-5 text-center font-black uppercase text-[10px] tracking-wider w-48">Pusat Aksi Akun</th>
                                </tr>
                            </thead>
                            <tbody id="guru-table-body" class="divide-y divide-slate-100">
                                <tr><td colspan="4" class="p-10 text-center text-slate-400 font-bold">Menghubungkan ke pangkalan data staf...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <div id="modal-guru" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white p-6 rounded-[24px] w-full max-w-md border border-slate-200 shadow-2xl animate-in zoom-in-95 duration-200">
             <h2 class="text-lg font-black mb-5 text-slate-800 flex items-center gap-2">
                 <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-blue-600"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                 Daftarkan Staf Baru
             </h2>
             <form id="form-guru-manual" class="space-y-4">
                 <div>
                     <label class="text-[10px] font-black text-slate-500 uppercase mb-1 block pl-0.5">Tugas & Otorisasi Sistem</label>
                     <select id="g_role" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-700 outline-none focus:border-blue-500 cursor-pointer">
                         <option value="teacher">Guru Bidang Studi (Pembuat Soal)</option>
                         <option value="proctor">Pengawas Ruangan (Hanya Pantau)</option>
                     </select>
                 </div>
                 <div><label class="text-[10px] font-black text-slate-500 uppercase mb-1 block pl-0.5">Nama Lengkap & Gelar</label><input type="text" id="g_name" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-700 outline-none focus:border-blue-500"></div>
                 <div><label class="text-[10px] font-black text-slate-500 uppercase mb-1 block pl-0.5">Email Resmi Akun</label><input type="email" id="g_email" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-700 outline-none focus:border-blue-500"></div>
                 <div><label class="text-[10px] font-black text-slate-500 uppercase mb-1 block pl-0.5">Kata Sandi Sementara</label><input type="text" id="g_pass" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-mono font-bold text-slate-700 outline-none focus:border-blue-500"></div>
                 
                 <div class="flex gap-3 mt-6 pt-2 border-t border-slate-100">
                     <button type="button" id="btn-close-guru-modal" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-bold transition-all">Batal</button>
                     <button type="submit" class="flex-1 py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-sm font-black transition-all">Buat Akun</button>
                 </div>
             </form>
        </div>
    </div>

    <script type="module">
        import { supabase } from '../../js/config/supabase.js';
        import { renderAdminSidebar } from '../../js/components/sidebar-admin.js';

        renderAdminSidebar();
        let schoolId = null;

        async function initPage() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) return window.location.href = '../auth/login.html';

            const { data: profile } = await supabase.from('users').select('*').eq('id', session.user.id).single();
            schoolId = profile.school_id;
            
            document.getElementById('user-name').innerText = profile.name;
            document.getElementById('user-initial').innerText = profile.name.charAt(0).toUpperCase();
            
            const { data: school } = await supabase.from('schools').select('name').eq('id', schoolId).single();
            document.getElementById('topbar-school-name').innerText = school ? school.name : schoolId.toUpperCase();

            fetchStaffData();
        }

        async function fetchStaffData() {
            const { data: users } = await supabase.from('users').select('*').eq('school_id', schoolId).in('role', ['teacher', 'proctor']).order('name', { ascending: true });
            if (!users) return;

            const pendingStaff = users.filter(u => u.status === 'pending');
            const activeStaff = users.filter(u => u.status !== 'pending');

            const pendingSection = document.getElementById('pending-section');
            if (pendingStaff.length > 0) {
                document.getElementById('count-pending').innerText = pendingStaff.length;
                pendingSection.classList.remove('hidden');
                document.getElementById('pending-grid').innerHTML = pendingStaff.map(t => `
                    <div class="bg-white p-4 rounded-2xl border border-amber-200 flex flex-col justify-between gap-3 shadow-sm">
                        <div>
                            <p class="font-black text-slate-800 text-sm uppercase">${t.name}</p>
                            <p class="font-bold text-slate-400 text-xs font-mono mt-0.5">${t.email}</p>
                        </div>
                        <div class="flex gap-2 border-t border-slate-100 pt-3">
                            <button onclick="actionStaff('approve', '${t.id}')" class="flex-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 py-2 rounded-xl text-xs font-black">Terima</button>
                            <button onclick="actionStaff('reject', '${t.id}')" class="flex-1 bg-rose-50 hover:bg-rose-100 text-rose-600 py-2 rounded-xl text-xs font-black">Tolak</button>
                        </div>
                    </div>
                `).join('');
            } else { pendingSection.classList.add('hidden'); }

            const tbody = document.getElementById('guru-table-body');
            if (activeStaff.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-10 text-center text-slate-400 font-bold border-2 border-dashed border-slate-100 m-4 rounded-[20px]">Belum ada akun guru/pengawas terdaftar.</td></tr>`;
                return;
            }

            tbody.innerHTML = activeStaff.map((t, index) => `
                <tr class="hover:bg-slate-50/80 transition-colors">
                    <td class="py-4 px-5 text-center font-bold text-slate-400 text-xs">${index + 1}</td>
                    <td class="py-4 px-5"><p class="font-black text-slate-800 text-sm">${t.name}</p><p class="text-[11px] text-slate-400 font-mono font-bold mt-0.5">${t.email}</p></td>
                    <td class="py-4 px-5"><span class="text-[9px] font-black uppercase px-2.5 py-1 rounded-xl border ${t.role === 'proctor' ? 'bg-indigo-50 text-indigo-600 border-indigo-200' : 'bg-emerald-50 text-emerald-600 border-emerald-200'}">${t.role === 'proctor' ? '🛠️ Pengawas Ruang' : '📚 Guru Mapel'}</span></td>
                    <td class="py-4 px-5">
                        <div class="flex justify-center gap-2">
                            <button onclick="actionStaff('reset', '${t.email}')" class="text-slate-400 hover:text-amber-600 bg-slate-50 hover:bg-amber-50 border border-slate-200 px-3 py-2 rounded-xl text-xs font-bold">Reset Sandi</button>
                            <button onclick="actionStaff('delete', '${t.id}')" class="text-slate-400 hover:text-rose-600 bg-slate-50 hover:bg-rose-50 border border-slate-200 p-2 rounded-xl">×</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        window.actionStaff = async (type, target) => {
            if (type === 'approve') { await supabase.from('users').update({ status: 'active' }).eq('id', target); fetchStaffData(); }
            if (type === 'reject' || type === 'delete') { if (confirm("Yakin hapus akun ini?")) { await supabase.from('users').delete().eq('id', target); fetchStaffData(); } }
            if (type === 'reset') { if (confirm(`Kirim instruksi reset sandi ke ${target}?`)) { await supabase.auth.resetPasswordForEmail(target); alert("Terkirim!"); } }
        };

        const modal = document.getElementById('modal-guru');
        document.getElementById('btn-open-guru-modal').onclick = () => modal.classList.replace('hidden', 'flex');
        document.getElementById('btn-close-guru-modal').onclick = () => modal.classList.replace('flex', 'hidden');

        document.getElementById('form-guru-manual').onsubmit = async (e) => {
            e.preventDefault();
            const { data: authData, error: authErr } = await supabase.auth.signUp({ email: document.getElementById('g_email').value, password: document.getElementById('g_pass').value });
            if (authErr) return alert("Gagal Auth: " + authErr.message);

            const { error: dbErr } = await supabase.from('users').insert([{
                id: authData.user.id, name: document.getElementById('g_name').value, email: document.getElementById('g_email').value,
                role: document.getElementById('g_role').value, school_id: schoolId, status: 'active'
            }]);

            if (!dbErr) { e.target.reset(); modal.classList.replace('flex', 'hidden'); fetchStaffData(); } 
            else alert("Gagal: " + dbErr.message);
        };

        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
