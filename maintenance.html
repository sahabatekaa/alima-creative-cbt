<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemeliharaan Sistem | Alima CBT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;900&display=swap'); body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4 relative overflow-hidden">
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10">
        <div class="absolute top-[10%] left-[20%] w-[300px] h-[300px] rounded-full bg-blue-600/10 blur-[80px] animate-pulse"></div>
        <div class="absolute bottom-[10%] right-[20%] w-[300px] h-[300px] rounded-full bg-emerald-500/10 blur-[80px] animate-pulse" style="animation-delay: 1s;"></div>
    </div>

    <div class="bg-white/80 backdrop-blur-xl p-8 md:p-12 rounded-[2rem] shadow-2xl border border-white max-w-lg w-full text-center relative z-10 animate-in zoom-in duration-500">
        <div class="flex justify-center mb-6 relative">
            <div class="w-24 h-24 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center shadow-inner relative z-10">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="animate-[spin_4s_linear_infinite]"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </div>
            <div class="w-24 h-24 border-4 border-dashed border-blue-200 rounded-full absolute animate-[spin_6s_linear_infinite_reverse]"></div>
        </div>

        <h1 class="text-3xl font-black text-slate-800 tracking-tight mb-3">Sistem Sedang Diperbarui</h1>
        <p class="text-slate-500 font-medium leading-relaxed mb-8">Kami sedang melakukan peningkatan performa dan pemeliharaan server rutin. Aplikasi ujian akan segera kembali normal dalam beberapa saat.</p>
        
        <div class="bg-blue-50 border border-blue-100 p-4 rounded-xl mb-8 flex items-center justify-center gap-2">
            <span class="relative flex h-3 w-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-blue-500"></span>
            </span>
            <span class="text-xs font-bold text-blue-700 uppercase tracking-widest">Engineer Sedang Bekerja</span>
        </div>

        <button onclick="window.location.reload()" class="bg-slate-900 hover:bg-slate-800 text-white w-full py-4 rounded-xl font-black tracking-widest transition-all shadow-lg active:scale-95 flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path></svg> MUAT ULANG HALAMAN
        </button>
    </div>
</body>
</html>
